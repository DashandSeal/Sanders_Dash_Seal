# Sanders Dash & Seal Canonical HTTP Routing Schema
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    # Single, clean mapping context to satisfy internal connection upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream pipeline_worker {
        server pipeline-worker:3000;
    }

    upstream transactional_core {
        server wsgi-backend:8000;
    }

    # Catch-all default server block dropping unmapped headers
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Standard port 80 secure canonical redirect layer
    server {
        listen 80;
        server_name sandersdashandseal.com ://sandersdashandseal.com sanderslegalhelpersllc.com ://sanderslegalhelpersllc.com;
        
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 308 https://$host$request_uri;
        }
    }

    # Drop unmapped HTTPS connections securely at the handshake stage
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # Global proxy canonical base routing configuration
    server {
        listen 443 ssl;
        server_name ://sandersdashandseal.com sanderslegalhelpersllc.com ://sanderslegalhelpersllc.com;
        
        ssl_certificate /etc/letsencrypt/live/://sandersdashandseal.com;
        ssl_certificate_key /etc/letsencrypt/live/://sandersdashandseal.com;
        ssl_protocols TLSv1.2 TLSv1.3;
        
        return 308 https://sandersdashandseal.com$request_uri;
    }

    # Protected Primary Transaction Interface Secure Context Block
    server {
        listen 443 ssl;
        server_name sandersdashandseal.com;

        ssl_certificate /etc/letsencrypt/live/://sandersdashandseal.com;
        ssl_certificate_key /etc/letsencrypt/live/://sandersdashandseal.com;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 1m;

        # Core execution routes safely exposed to handle payment triggers
        location /api/ {
            allow 10.0.0.0/24;
            deny all;
            
            proxy_pass http://transactional_core;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Secure isolation path for dashboard metrics data streams
        location /v1/telemetry/dashboard {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_buffering off;
            proxy_read_timeout 60s;
            
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # High-concurrency WebSocket channels endpoint infrastructure
        location /ws {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location /release-status.json {
            root /srv/sds-status;
        }

        # Catch-all baseline interface layer
        location / {
            proxy_pass http://transactional_core;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
