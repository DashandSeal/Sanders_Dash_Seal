# Sanders Dash & Seal Canonical HTTP Routing Schema
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Universal I/O Performance Tuning Options
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    access_log off;
    server_tokens off;

    # Dynamic Memory Allocation Settings
    types_hash_max_size 4096;
    client_max_body_size 64M;

    # Global SSL/TLS Performance Upgrades
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream pipeline_worker {
        server pipeline-worker:3000;
        keepalive 32;
    }

    upstream transactional_core {
        server wsgi-backend:8000;
        keepalive 32;
    }

    # Catch-all default block (Drops unmapped headers cleanly)
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Standard Port 80 Secure Redirect Context
    server {
        listen 80;
        server_name sandersdashandseal.com sanderslegalhelpersllc.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 308 https://sandersdashandseal.com$request_uri;
        }
    }

    # Drop unmapped HTTPS connections securely at handshake stage
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # Isolated Secure Mirror Domain Redirect (Removes Port 443 server_name duplication)
    server {
        listen 443 ssl http2;
        server_name sanderslegalhelpersllc.com;

        ssl_certificate /etc/letsencrypt/live/://sandersdashandseal.com;
        ssl_certificate_key /etc/letsencrypt/live/://sandersdashandseal.com;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 308 https://sandersdashandseal.com$request_uri;
    }

    # Unified Primary Application Secure Context Block
    server {
        listen 443 ssl http2;
        server_name sandersdashandseal.com;

        ssl_certificate /etc/letsencrypt/live/://sandersdashandseal.com;
        ssl_certificate_key /etc/letsencrypt/live/://sandersdashandseal.com;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Hardlock High-Resilience Handshake Settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;

        # Architectural Proxy Buffer Tuning
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_redirect off;

        # Defensive Tripwire Blocks (Added from your PR changes)
        location = /api/auth/verify { return 404; }
        location = /api/transactions/process { return 404; }
        location = /api/stream/transactions {}

        # Core execution routes safely exposed to handle payment triggers
        location /api/ {
            allow 10.0.0.0/24;
            deny all;

            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Secure isolation path for dashboard metrics data streams
        location /v1/telemetry/dashboard {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;

            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # High-concurrency WebSocket channels endpoint infrastructure
        location /ws {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;
            proxy_buffering off;
        }

        # High-concurrency spatial-casting endpoint orchestration infrastructure
        location /v1/telemetry/cast {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 30s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        location /release-status.json {
            root /srv/sds-status;
        }

        # Catch-all baseline interface layer
        location / {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
        }
    }
}
