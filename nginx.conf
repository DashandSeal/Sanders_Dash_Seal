worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream pipeline_worker { server pipeline-worker:3000; }
    upstream transactional_core { server wsgi-backend:8000; }
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name sandersdashandseal.com www.sandersdashandseal.com sanderslegalhelpersllc.com www.sanderslegalhelpersllc.com;
        location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 308 https://sandersdashandseal.com$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
    server {
        listen 443 ssl;
        server_name www.sandersdashandseal.com sanderslegalhelpersllc.com www.sanderslegalhelpersllc.com;
        ssl_certificate /etc/letsencrypt/live/sandersdashandseal.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sandersdashandseal.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 308 https://sandersdashandseal.com/;
    }
    server {
        listen 443 ssl;
        server_name sandersdashandseal.com;
        ssl_certificate /etc/letsencrypt/live/sandersdashandseal.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sandersdashandseal.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;
        location = /api/auth/verify { return 404; }
        location = /api/transactions/process { return 404; }
        location = /api/stream/transactions {
            # Direct VCN connections only; never trust client forwarded IPs.
            allow 10.0.0.0/24;
            deny all;
            proxy_pass http://transactional_core;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location = /v1/telemetry/dashboard {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /ws {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For "";
            proxy_read_timeout 75s;
            proxy_buffering off;
        }
        location = /release-status.json { root /srv/sds-status; }
        location / {
            proxy_pass http://transactional_core;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
