# ==============================================================================
# LEVEL 10 SOVEREIGN BASELINE // NGINX ROUTING & SECURITY MANIFEST
# Platform: Sanders Dash & Seal / Sanders Legal Helpers LLC
# Stewardship: Sanders Family Living Trust & Bloodline Descendants
# Compliance: NASA-STD, ISO 20022, GDPR/CCPA, Court-Defendable Forensic Admissibility
# Authentication: Roosevelt Master Signature / NACI Industries Framework
# -----------------------------------------------------------------------------
# 2026-11-13 upgrade (branch upgrade/sota-web-nginx-20261113):
#   nginx 1.25-alpine (EOL; misses the 14 Oct 2026 security fixes in 1.30.6)
#   -> nginx 1.30.6 stable (nginx:1.30.6-alpine, multi-arch incl. arm64).
#   Adds: security headers + HSTS, rate limiting, gzip, HTTP->HTTPS redirect
#   with ACME challenge passthrough, modern TLS (Mozilla intermediate,
#   session tickets off, OCSP stapling), $connection_upgrade map, and
#   container-DNS upstreams (see below).
#   Preserved verbatim: tripwire 404s, /api/ allow 10.0.0.0/24 + deny all,
#   server timeouts 30s/360s/360s, /api/ 5s/10s, / 5s/75s, webhook guards.
#   NOT provisioned here: TLS certificates. The Let's Encrypt paths below
#   must already exist on the host / certs volume or nginx will not start.
#   No Content-Security-Policy is set: the app serves inline scripts and a
#   wrong CSP breaks it. CSP is an owner/app decision after a script audit.
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # WebSocket upgrade mapping. $connection_upgrade is NOT a built-in
    # variable: without this map the /ws/ and /v1/telemetry/cast locations
    # sent an empty Connection header and upgrades silently failed.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limits, sized for a 1-OCPU Always Free host (10 MB zones).
    limit_req_zone $binary_remote_addr zone=sds_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=sds_webhook:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=sds_conn:10m;

    # Compression for text responses only (never for media that is already
    # compressed). Applies to proxied responses via gzip_proxied any.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Global security headers, applied to every response including errors.
    # NOTE: any location that sets its own add_header loses these inherited
    # headers (nginx inheritance rule), so the webhook and telemetry
    # locations below repeat them explicitly.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Upstream Core Definitions.
    # Container-DNS names, NOT 127.0.0.1: the nginx container's own loopback
    # is not the backend. Ports match gunicorn 127.0.0.1:8000 inside the
    # wsgi-backend container and the Node pipeline worker PORT=3000.
    upstream transactional_core {
        server wsgi-backend:8000;
        keepalive 32;
    }

    upstream pipeline_worker {
        server pipeline-worker:3000;
        keepalive 32;
    }

    # HTTP: keep the ACME challenge reachable; everything else -> HTTPS.
    # Previously no server listened on port 80 at all, even though Compose
    # publishes 80:80, so plain-HTTP requests failed outright.
    server {
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Unified Primary Application Secure Context Block
    server {
        listen 443 ssl;
        http2 on;
        server_name sandersdashandseal.com sanderslegalhelpersllc.com;

        ssl_certificate /etc/letsencrypt/live/sandersdashandseal.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sandersdashandseal.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Mozilla intermediate (2026). TLS 1.3 suites are automatic; this
        # list governs TLS 1.2 only. ssl_prefer_server_ciphers off is
        # correct once TLS 1.3 is offered (the client picks for 1.3).
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/sandersdashandseal.com/chain.pem;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        limit_conn sds_conn 50;

        # Hardlock High-Resilience Handshake Settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;

        # Architectural Proxy Buffer Tuning
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_redirect off;

        # Defensive Tripwire Blocks
        location = /api/auth/verify { return 404; }
        location = /api/transactions/process { return 404; }
        location = /api/stream/transactions { return 404; }

        # Core execution routes safely exposed to handle payment triggers
        location /api/ {
            allow 10.0.0.0/24;
            deny all;

            limit_req zone=sds_api burst=20 nodelay;

            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # Hardened Endpoint for Cryptographically Guarded Payment Webhook Transport
        location = /v1/payments/stripe/webhook {
            limit_req zone=sds_webhook burst=20 nodelay;

            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Explicit memory guards matching application safety limits
            client_max_body_size 64k;
            client_body_buffer_size 64k;

            # Anti-Slowloris Mitigation Gates. client_header_timeout is
            # http/server-only and cannot appear in a location (the old
            # config had it here, which made nginx -t fail); the 10s
            # server-level client_header_timeout above already applies.
            client_body_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;

            # Near-zero disk buffering layer to maximize performance on Always Free storage limits
            proxy_buffering off;
            proxy_request_buffering on;

            # Cryptographic & Identity Routing Context
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Cache Breaker and Security Framing. Global headers are
            # repeated here because this location's own add_header
            # directives would otherwise suppress the inherited ones.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        # Secure isolation path for dashboard metrics data streams
        location /v1/telemetry/dashboard {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;

            # Global headers repeated: this location's own add_header
            # directives would otherwise suppress the inherited ones.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cache-Control "no-store" always;
        }

        # High-concurrency WebSocket channels endpoint infrastructure
        location /ws/ {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;
            proxy_buffering off;
        }

        # High-concurrency spatial-casting endpoint orchestration infrastructure
        # NOTE: 86400s (24h) timeouts are preserved from the previous config
        # as-is. Revisit: a full-day idle timeout per cast connection is
        # generous for a 1-OCPU host and can pin workers/connections.
        location /v1/telemetry/cast {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 30s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        location /release-status.json {
            # Aligned with the deploy/compose.production.yml mount
            # (/var/lib/sanders-dash-seal/public -> /srv/sds-status).
            # Was /srv/sds/status, which nothing mounts.
            root /srv/sds-status;
        }

        # Catch-all baseline interface layer
        location / {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
        }
    }
}
