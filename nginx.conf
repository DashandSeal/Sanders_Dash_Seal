# ==============================================================================
# LEVEL 10 SOVEREIGN BASELINE // NGINX ROUTING & SECURITY MANIFEST
# Platform: Sanders Dash & Seal / Sanders Legal Helpers LLC
# Stewardship: Sanders Family Living Trust & Bloodline Descendants
# Compliance: NASA-STD, ISO 20022, GDPR/CCPA, Court-Defendable Forensic Admissibility
# Authentication: Roosevelt Master Signature / NACI Industries Framework
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # WebSocket upgrade mapping. $connection_upgrade is used by the /ws/
    # and /v1/telemetry/cast locations below; without this map block nginx
    # fails to start ("unknown variable $connection_upgrade").
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Core Definitions. These are compose service names and the
    # ports those services actually listen on, not loopback ports on the
    # nginx container: the WSGI backend is the wsgi-backend service on
    # 8000 (deploy/gunicorn.conf.py binds 127.0.0.1:8000 inside its own
    # container) and the Node worker is the pipeline-worker service on
    # 3000 (worker/src/index.js PORT, compose.yaml). The previous
    # 127.0.0.1:8080/8081 pointed at nothing in any compose file.
    upstream transactional_core {
        server wsgi-backend:8000;
    }

    upstream pipeline_worker {
        server pipeline-worker:3000;
    }

    # Unified Primary Application Secure Context Block
    server {
        listen 443 ssl http2;
        server_name sandersdashandseal.com sanderslegalhelpersllc.com;

        ssl_certificate /etc/letsencrypt/live/sandersdashandseal.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sandersdashandseal.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Hardlock High-Resilience Handshake Settings
        proxy_connect_timeout 30s;        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
        # client_header_timeout is valid in http/server context only, not
        # in a location block; it lives here at server level.
        client_header_timeout 10s;

        # Camera/mic denied everywhere by default (free-first fix #7);
        # only location = /voice.html below relaxes this for getUserMedia.
        # Locations with their own add_header directives (webhook,
        # telemetry) do not inherit this; they serve no camera/mic page.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Architectural Proxy Buffer Tuning
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_redirect off;

        # The three API routes below used to be 404 tripwires here, which
        # contradicted the code: core_platform/deployment.py routes
        # /api/auth/verify, /api/transactions/process and
        # /api/stream/transactions, and worker/src/index.js plus the
        # serverless caller call them. The tripwires are removed; these
        # paths are now proxied by the location /api/ block below, and
        # authentication is enforced by the application itself.
        # Core execution routes safely exposed to handle payment triggers
        location /api/ {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Hardened Endpoint for Cryptographically Guarded Payment Webhook Transport
        location = /v1/payments/stripe/webhook {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Explicit memory guards matching application safety limits
            client_max_body_size 64k;
            client_body_buffer_size 64k;

            # Anti-Slowloris Mitigation Gates
            client_body_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;

            # Near-zero disk buffering layer to maximize performance on Always Free storage limits
            proxy_buffering off;
            proxy_request_buffering on;

            # Cryptographic & Identity Routing Context
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Cache Breaker and Security Framing
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        # Secure isolation path for dashboard metrics data streams
        location /v1/telemetry/dashboard {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;

            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # High-concurrency WebSocket channels endpoint infrastructure
        location /ws/ {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;
            proxy_buffering off;
        }

        # High-concurrency spatial-casting endpoint orchestration infrastructure
        location /v1/telemetry/cast {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 30s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        location /release-status.json {
            root /srv/sds/status;
        }

        # Video page only: /voice.html needs camera/mic for getUserMedia.
        # Every other response keeps camera/microphone denied (no
        # Permissions-Policy header is set elsewhere in this file).
        # This location repeats the proxy headers because its own
        # add_header directives suppress the inherited ones.
        location = /voice.html {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;

            add_header X-Content-Type-Options "nosniff" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        }

        # Catch-all baseline interface layer
        location / {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
        }
    }
}
