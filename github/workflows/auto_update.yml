name: Universal Repository Pipeline Orchestration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # JOB 1: Keep all feature branches universally updated with main changes
  autoupdate:
    name: Sync Open Feature Pull Requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Automatically Update PR Branches
        uses: channal/github-pr-autoupdate-action@v2
        with:
          pr_filter: "all"
          pr_ready_state: "all"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JOB 2: Universally validate syntax and structural configurations in parallel
  validate-infrastructure:
    name: Audit Configuration Profiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config_target: [ 'nginx.conf', 'compose.yaml', 'docker-compose.yml' ]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Verify Configuration Syntax & Duplications
        run: |
          echo "Running universal lint matrix against target: ${{ matrix.config_target }}"
          
          # Check if the file exists before attempting validation to protect optional configurations
          if [ ! -f "${{ matrix.config_target }}" ]; then
            echo "${{ matrix.config_target }} does not exist in this context, skipping verification."
            exit 0
          fi

          # Nginx Syntax Validation
          if [ "${{ matrix.config_target }}" = "nginx.conf" ]; then
            docker run --rm -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t || exit 1
          fi

          # Docker Compose Syntax Validation
          if [ "${{ matrix.config_target }}" = "compose.yaml" ] || [ "${{ matrix.config_target }}" = "docker-compose.yml" ]; then
            docker compose -f ${{ matrix.config_target }} config --quiet || exit 1
          fi

  # JOB 3: Run comprehensive preflight test sweeps to verify routing and security policy match
  preflight-integration:
    name: Preflight Security and Routing Sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Testing Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: pip install requests pytest

      - name: Execute Automated Structural Compliance Tests
        run: |
          python -c "
          import json, os
          
          # 1. Verify compliance with security/forensic-policy duplicate groups
          if os.path.exists('security/forensic-policy'):
              with open('security/forensic-policy', 'r') as f:
                  policy = json.load(f)
              print('Forensic policy loaded successfully. Structural schema version:', policy.get('schema'))
          else:
              print('No structural policy constraint found. Proceeding with standard routing checks.')
          "
