name: Sovereign ExpressWay Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  expressway-reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ZeusOmega & SpeedRacer ExpressWay Secure Reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "[ZeusOmega] Initializing Platinum Forensic ExpressWay..."
          
          # Configure git identity for the automation watchdogs
          git config --global user.name "Sanders Platform Watchdogs [ZeusOmega/SpeedRacer]"
          git config --global user.email "watchdogs@sanderssecurestack.com"

          # Deterministic sync branch name based on short SHA
          SHORT_SHA=$(git rev-parse --short HEAD)
          SYNC_BRANCH="zeusomega-expressway-sync-${SHORT_SHA}"

          # Create or reset sync branch cleanly
          git checkout -B "$SYNC_BRANCH"

          # Stage all reconciled manifests, sidecars, and scripts
          git add -A
          
          # Check if there are actual changes to commit
          if git diff --staged --quiet; then
            echo "[SpeedRacer] No changes detected. ExpressWay pipeline standing by."
            exit 0
          fi

          # Commit with immutable tracking signature
          git commit -m "chore(expressway): auto-reconcile ZeusOmega & SpeedRacer patch assets [atomic-sync]"

          # Push to the feature sync branch
          git push origin "$SYNC_BRANCH" --force

          echo "[ExpressWay] Opening or updating compliant automated Pull Request..."
          
          # Idempotently create Pull Request via GitHub CLI
          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "🔒 Sovereign ExpressWay: ZeusOmega & SpeedRacer Automated Patch Sync" \
            --body "Automated synchronization manifest generated by ZeusOmega and SpeedRacer via the Platinum Forensic ExpressWay. Compliant with protected branch protocols." || echo "Pull Request already exists for this branch."

          echo "[ExpressWay] ExpressWay synchronization completed successfully."
