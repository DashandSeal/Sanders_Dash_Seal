<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Sanders Dash &amp; Seal</title><link rel="stylesheet" href="/assets/booking.css"><script src="/assets/auth.js" defer></script></head>
<body><header class="top"><a class="brand" href="/">Sanders Dash &amp; Seal</a><a href="/appointments">Appointments</a></header><main><section class="card"><p class="eyebrow">YOUR ACCOUNT</p><h1 id="auth-title">Sign in</h1><p id="auth-description">Sign in to request an appointment and follow its progress.</p><form id="account-form"><div id="account-fields"><label for="username">Account name</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="64" pattern="[a-z0-9][a-z0-9_.\-]{2,63}" required><small>Use lowercase letters, numbers, dots, dashes or underscores.</small><label for="password">Passphrase</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="15" maxlength="128" required><div id="setup-field" hidden><label for="setup-token">Owner setup secret</label><input id="setup-token" type="password" autocomplete="off" maxlength="43"></div></div><button id="account-submit" class="primary" type="submit">Sign in</button><p id="auth-message" role="status" aria-live="polite"></p></form><p><a id="auth-alternative" href="/auth/register">Create an account</a></p></section></main><footer>Sanders Dash &amp; Seal · Sanders Legal Helpers LLC</footer></body></html>
