<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanders Dash &amp; Seal — Voice</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 640px; padding: 0 1rem; }
  button { margin: 0.25rem 0.5rem 0.25rem 0; padding: 0.5rem 1rem; }
  #status { margin: 1rem 0; }
  video { width: 100%; max-height: 320px; background: #111; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f4f4f4; padding: 1rem; }
</style>
</head>
<body>
<h1>Voice — Sanders Dash &amp; Seal</h1>
<!--
  Browser voice capture. Dependency-free vanilla JS.

  REQUIREMENTS / LIMITS (read before demoing):
  - Needs HTTPS or localhost, and the user must grant microphone
    (and camera, for video preview) permission. Without permission the
    browser blocks getUserMedia and nothing is recorded.
  - Codecs differ by browser: Chrome/Firefox record Opus/WebM,
    Safari records AAC/MP4. The server endpoint /api/voice/transcribe
    accepts WAV PCM-16 only, so a recorded blob must be converted
    server-side with ffmpeg (not bundled) or recorded as WAV before a
    real browser round-trip works end to end.
  - This page records audio (and shows an optional video preview). It
    does NOT open a live call: video calling is WebRTC signalling only
    (see worker/src/webrtc.js) and needs a separate SFU / provider.
  - Nothing is recorded, uploaded or stored until you press a button.
-->
<p id="status">Idle. Grant microphone permission to record.</p>
<video id="preview" autoplay muted playsinline></video>
<p>
  <button id="startBtn" type="button">Start recording</button>
  <button id="stopBtn" type="button" disabled>Stop &amp; transcribe</button>
  <button id="speakBtn" type="button">Speak the transcript</button>
</p>
<p>
  <label for="speakText">Text to speak:</label><br>
  <textarea id="speakText" rows="3" cols="60">Hello from Sanders Dash and Seal.</textarea>
</p>
<h2>Transcript</h2>
<pre id="transcript">(none yet)</pre>
<h2>Heard / played back</h2>
<audio id="player" controls></audio>
<script>
'use strict';
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const previewEl = document.getElementById('preview');
const playerEl = document.getElementById('player');
const speakTextEl = document.getElementById('speakText');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const speakBtn = document.getElementById('speakBtn');

let mediaStream = null;
let recorder = null;
let chunks = [];

function setStatus(text) { statusEl.textContent = text; }

async function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('This browser does not support media capture (needs HTTPS/localhost).');
    return;
  }
  try {
    // Audio is required; video is an optional preview only.
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
  } catch (err) {
    setStatus('Permission denied or no microphone/camera: ' + err.name);
    return;
  }
  previewEl.srcObject = mediaStream;
  chunks = [];
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : undefined;
  recorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
  recorder.ondataavailable = (event) => { if (event.data && event.data.size) chunks.push(event.data); };
  recorder.onstop = sendRecording;
  recorder.start();
  startBtn.disabled = true;
  stopBtn.disabled = false;
  setStatus('Recording… (codec: ' + (recorder.mimeType || 'browser default') + '). ' +
    'Note: the server accepts WAV PCM-16 only; this blob needs ffmpeg conversion server-side.');
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  stopBtn.disabled = true;
  startBtn.disabled = false;
}

async function sendRecording() {
  if (mediaStream) {
    mediaStream.getTracks().forEach((track) => track.stop());
    previewEl.srcObject = null;
  }
  const blob = new Blob(chunks, { type: recorder ? recorder.mimeType : 'audio/webm' });
  if (!blob.size) { setStatus('Nothing was recorded.'); return; }
  setStatus('Uploading ' + blob.size + ' bytes (' + blob.type + ') to /api/voice/transcribe…');
  try {
    const response = await fetch('/api/voice/transcribe', { method: 'POST', body: blob });
    const data = await response.json();
    if (!response.ok) {
      setStatus('Transcription failed (' + response.status + '): ' + (data.error || 'unknown error'));
      return;
    }
    transcriptEl.textContent = data.transcript || '(empty transcript)';
    speakTextEl.value = data.transcript || '';
    setStatus('Transcribed.');
  } catch (err) {
    setStatus('Upload failed: ' + err.message);
  }
}

async function speakText() {
  const text = speakTextEl.value.trim();
  if (!text) { setStatus('Enter text to speak first.'); return; }
  setStatus('Requesting speech…');
  try {
    const response = await fetch('/api/voice/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      setStatus('Speech failed (' + response.status + '): ' + (data.error || 'unknown error'));
      return;
    }
    const blob = await response.blob();
    playerEl.src = URL.createObjectURL(blob);
    await playerEl.play();
    setStatus('Playing back.');
  } catch (err) {
    setStatus('Speech request failed: ' + err.message);
  }
}

startBtn.addEventListener('click', startRecording);
stopBtn.addEventListener('click', stopRecording);
speakBtn.addEventListener('click', speakText);
</script>
</body>
</html>
