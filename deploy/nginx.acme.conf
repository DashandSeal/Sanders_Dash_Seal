events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name sandersdashandseal.com www.sandersdashandseal.com sanderslegalhelpersllc.com www.sanderslegalhelpersllc.com;
        location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 503; }
    }
}
