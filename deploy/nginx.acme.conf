events { worker_connections 128; }
http {
    access_log off;
    # 2026-11-28: long company subdomain names need a larger bucket.
    server_names_hash_bucket_size 128;
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name sandersdashandseal.com www.sandersdashandseal.com sanderslegalhelpersllc.com www.sanderslegalhelpersllc.com sanderssixshield.com www.sanderssixshield.com sanderssecurestack.com www.sanderssecurestack.com sandersemergencyglobalcommunication.com www.sandersemergencyglobalcommunication.com sandersnexusshield.com www.sandersnexusshield.com sanderssixindustry.com www.sanderssixindustry.com sandgsecurityinc.sanderslegalhelpersllc.com sandershomehealthcareandcaregiversllc.sanderslegalhelpersllc.com sandersseniorlivingllc.sanderslegalhelpersllc.com;
        location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 503; }
    }
}
