services:
  node-tests:
    build:
      context: .
      dockerfile: deploy/preflight.Dockerfile
      target: node-tests
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      HOME: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
  python-tests:
    build:
      context: .
      dockerfile: deploy/preflight.Dockerfile
      target: python-tests
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      HOME: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
