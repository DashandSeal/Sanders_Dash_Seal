{
  "services": {
    "ai-uptimeagent": {
      "image": "${SDS_COMPOSE_PROJECT:-sanders-dash-seal}-wsgi-backend:latest",
      "profiles": [
        "ai"
      ],
      "restart": "unless-stopped",
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 32,
      "mem_limit": "128m",
      "cpus": 0.05,
      "command": [
        "python",
        "-m",
        "core_platform.ai_role_workers",
        "--role",
        "UptimeAgent"
      ],
      "network_mode": "service:wsgi-backend",
      "volumes": [
        "/etc/sanders-dash-seal/ai-roles/identities/UptimeAgent.json:/run/sds-role/identity.json:ro,z",
        "/etc/sanders-dash-seal/ai-roles/public:/run/sds-ai:ro,z",
        "/etc/sanders-dash-seal/ai-roles/public/results/UptimeAgent:/run/sds-role/output:rw,z"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=16m"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import time,pathlib; p=pathlib.Path('/run/sds-role/output/latest.json'); assert p.is_file() and 0<=time.time()-p.stat().st_mtime<=90"
        ],
        "interval": "60s",
        "timeout": "5s",
        "retries": 2,
        "start_period": "30s"
      }
    },
