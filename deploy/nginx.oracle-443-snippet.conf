# Sanders Dash & Seal — HTTPS (port 443) server block, follow-up to nginx.oracle.conf.
#
# Append this server block to /etc/nginx/nginx.conf AFTER DNS points
# sandersdashandseal.com / sanderslegalhelpersllc.com at the instance
# (129.146.111.166) and certbot has issued certificates:
#   dnf install -y certbot python3-certbot-nginx
#   certbot --nginx -d sandersdashandseal.com -d www.sandersdashandseal.com \
#           -d sanderslegalhelpersllc.com -d www.sanderslegalhelpersllc.com
# Then: nginx -t && systemctl reload nginx
#
# Locations mirror nginx.oracle.conf exactly (same upstreams, same fixes);
# only the listener, server_name and TLS settings differ. Keep the two files
# in sync when a location changes.

server {
    listen 443 ssl;
    http2 on;
    server_name sandersdashandseal.com www.sandersdashandseal.com
                 sanderslegalhelpersllc.com www.sanderslegalhelpersllc.com;

    ssl_certificate /etc/letsencrypt/live/sandersdashandseal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandersdashandseal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    proxy_connect_timeout 30s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
    proxy_next_upstream error timeout invalid_header http_502 http_503;
    proxy_redirect off;
    client_header_timeout 10s;

    # Private stream route ONLY (see nginx.oracle.conf for the rationale).
    location = /api/stream/transactions {
        allow 10.0.0.0/24;
        deny all;
        proxy_pass http://api_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /api/auth/verify {
        proxy_pass http://api_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /api/transactions/process {
        proxy_pass http://api_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://api_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /v1/payments/stripe/webhook {
        proxy_pass http://transactional_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        client_body_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location = /healthz {
        proxy_pass http://api_core;
        proxy_http_version 1.1;
        proxy_set_header Host sandersdashandseal.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /readyz {
        proxy_pass http://api_core;
        proxy_http_version 1.1;
        proxy_set_header Host sandersdashandseal.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /v1/telemetry/dashboard {
        proxy_pass http://pipeline_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 360s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ws/ {
        proxy_pass http://pipeline_worker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 360s;
        proxy_buffering off;
    }

    location /v1/telemetry/cast {
        proxy_pass http://pipeline_worker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /release-status.json {
        root /srv/sds/status;
    }

    location / {
        proxy_pass http://api_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }
}
