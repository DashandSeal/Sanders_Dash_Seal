# Add INSIDE the existing TLS server block, not at nginx.conf top level.
# The internal Bozly container binds only to 127.0.0.1:8185 on the host.
# If Nginx runs in another container, connect it over a deliberate private
# Docker network instead; 127.0.0.1 there refers to the Nginx container.
location ^~ /v1/telemetry/webhooks/ {
    proxy_pass http://127.0.0.1:8185;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Stripe-Signature $http_stripe_signature;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_request_buffering on;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
