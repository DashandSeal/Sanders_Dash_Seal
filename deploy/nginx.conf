# Sanders Dash & Seal — SIMULTANEOUS deploy nginx config (HTTP, port 80).
# 2026-11-13. Based on deploy-oracle-20261113/deploy/nginx.oracle.conf,
# reconciled with deploy/immediate-20261113 nginx.conf.
#
# TRIPWIRE DECISION (documented, per package task): the three
# `return 404` tripwires on /api/auth/verify, /api/transactions/process
# and /api/stream/transactions are REMOVED. They made the API unreachable
# by design. The unified WSGI app now answers honestly (404
# endpoint_not_found for routes with no handler; 503 for unconfigured
# services). The SOTA branch (upgrade/sota-web-nginx-20261113) PRESERVED
# those tripwires — that choice was NOT taken here.
# Likewise the blanket `allow 10.0.0.0/24; deny all;` on `location /api/`
# is REMOVED. That restriction now applies ONLY to
# `location = /api/stream/transactions` (private OCI-Function route).
#
# ROUTING (one gunicorn, 127.0.0.1:8000, unified wsgi:application):
#   / , /healthz, /voice.html, /api/voice/*, /api/daedalus/describe,
#   /v1/payments/stripe/webhook, /api/* (other) -> 127.0.0.1:8000
#   /v1/telemetry/dashboard, /ws/, /v1/telemetry/cast -> 127.0.0.1:3000 (Node worker)
# There is NO second gunicorn on 8001 in this package (unlike the Oracle
# package, which ran a separate deployment app there). The deployment app's
# /healthz 308/421 host gate is therefore not in the request path.
#
# TLS is NOT in this package: no 443 server here. After DNS points at the
# instance, run certbot and append deploy/nginx-443-snippet.conf.
# Install: cp deploy/nginx.conf /etc/nginx/nginx.conf && nginx -t

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream transactional_core {
        server 127.0.0.1:8000;  # gunicorn wsgi:application (unified)
    }

    upstream pipeline_worker {
        server 127.0.0.1:3000;  # node worker/src/index.js
    }

    server {
        listen 80 default_server;
        server_name _;

        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_redirect off;
        client_header_timeout 10s;

        # Private stream route ONLY: OCI Function callers in the VCN subnet.
        location = /api/stream/transactions {
            allow 10.0.0.0/24;
            deny all;

            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Stripe webhook transport (webhook app only serves this path).
        location = /v1/payments/stripe/webhook {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            client_max_body_size 64k;
            client_body_buffer_size 64k;
            client_body_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location /api/voice/ {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /v1/telemetry/dashboard {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /ws/ {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;
            proxy_buffering off;
        }

        location /v1/telemetry/cast {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 30s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        location /release-status.json {
            root /srv/sds/status;
        }

        location / {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
        }
    }
}
