worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 1m;
        location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
        location = /healthz {
            proxy_pass http://wsgi-backend:8000;
            proxy_set_header Host sandersdashandseal.com;
        }
        location = /readyz {
            proxy_pass http://wsgi-backend:8000;
            proxy_set_header Host sandersdashandseal.com;
        }
        location = /release-status.json { root /srv/sds-status; }
        location = / { root /srv/sanders-public; try_files /index.html =404; }
        location = /appointments { root /srv/sanders-public; try_files /index.html =404; }
        location /assets/ { alias /srv/sanders-public/; }
        location / { return 403; }
    }
}
