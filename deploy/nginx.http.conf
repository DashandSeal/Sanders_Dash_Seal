# ==============================================================================
# ARCHITECTURAL LAYER: REAL-TIME SYNTHETIC AI REVERSE PROXY FIREWALL MATRIX
# PATH: /deploy/nginx.http.conf
# SYSTEM: Sanders Dash & Seal (Oracle Always Free Production Resource Stack)
# PROPERTY OF: Sanders Legal Helpers LLC | DEVELOPED BY: Roosevelt Sanders
# ==============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;

    # Secure Upstream Target Declaration (Binding to your WSGI Container Node)
    upstream application_backend {
        server wsgi-backend:8000;
        keepalive 32;
    }

    # Real-Time Rate-Limiting Protection (Anti-DDOS Webhook Protection)
    limit_req_zone $binary_remote_addr zone=sds_webhook_rate:10m rate=30r/s;

    # ==========================================================================
    # DOMAIN 1: Sanders Legal Helpers LLC Corporate Storefront
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name sanderslegalhelpersllc.com //sanderslegalhelpersllc.com;

        # SSL Certifications (Provisioned via local volume mapping hooks)
        ssl_certificate /etc/letsencrypt/live///sanderslegalhelpersllc.com;
        ssl_certificate_key /etc/letsencrypt/live///sanderslegalhelpersllc.com;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Reverse Proxy to Corporate Storefront Pages
        location / {
            root /var/www/sanders_legal_helpers;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Secure Handoff to Internal Accounts Administration Pipeline
        location /api/auth {
            proxy_pass http://application_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==========================================================================
    # DOMAIN 2: Sanders Dash and Seal Operational Platform Application Gateway
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name sandersdashandseal.com //sandersdashandseal.com;

        ssl_certificate /etc/letsencrypt/live///sandersdashandseal.com;
        ssl_certificate_key /etc/letsencrypt/live///sandersdashandseal.com;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Hardened Endpoint for Cryptographically Guarded Payment Webhook Transport
        location = /v1/payments/stripe/webhook {
            # Enforce real-time transaction throttling boundaries at edge
            limit_req zone=sds_webhook_rate burst=20 nodelay;

            proxy_pass http://application_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Explicit memory guards matching application safety limits
            client_max_body_size 64k;
            client_body_buffer_size 64k;

            # Anti-Slowloris Mitigation Gates
            client_body_timeout 10s;
            client_header_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;

            # Low resource footprint settings
            proxy_buffering off;
            proxy_request_buffering on;

            # Cryptographic & Identity Routing Context
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Cache Breaker and Security Framing
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        # Root Endpoint Routes Directly into the Interactive Platform App
        location / {
            proxy_pass http://application_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Operational Resource & Ingestion Endpoints Integration
        location /api/platform/free-resources {
            proxy_pass http://application_backend;
            proxy_set_header Host sandersdashandseal.com;
        }

        location /appointments {
            root /srv/sanders-public;
            try_files $uri $uri/ =404;
        }

        location /assets/ {
            alias /srv/sanders-public/;
        }

        # Strict Block over Intercepted Internal Pipeline Endpoints
        location /api/transactions/process {
            return 404;
        }
    }

    # ==========================================================================
    # GLOBAL REGISTRATION SERVICE: HTTP Redirection & ACME Certificate Validation
    # ==========================================================================
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 1m;

        # Keep ACME certbot validation endpoints accessible at basic web layer
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location /healthz {
            proxy_pass http://application_backend;
            proxy_set_header Host sandersdashandseal.com;
        }

        location /readyz {
            proxy_pass http://application_backend;
            proxy_set_header Host sandersdashandseal.com;
        }

        location /release-status.json {
            root /srv/sds-status;
        }

        # Force HTTP to HTTPS conversion safely for all primary domains
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
