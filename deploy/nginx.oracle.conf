# Sanders Dash & Seal — Oracle direct-deploy nginx config (HTTP, port 80).
#
# Derived from the repo nginx.conf with these fixes (2026-11-13):
#  - REMOVED the three `return 404` tripwires on /api/auth/verify,
#    /api/transactions/process and /api/stream/transactions. They made the
#    API unreachable by design; the Python app now answers honestly
#    (503 authority_unavailable / stream_unavailable until real
#    RuntimeBindings exist — no fake success).
#  - REMOVED the blanket `allow 10.0.0.0/24; deny all;` on `location /api/`.
#    That blocked every public API caller. The 10.0.0.0/24 restriction now
#    applies ONLY to `location = /api/stream/transactions`, which is the
#    private OCI-Function route by design (docs/STREAMING_INTEGRATION.md).
#  - FIXED upstreams to the real direct-deploy ports: gunicorn webhook app on
#    127.0.0.1:8000, gunicorn deployment app on 127.0.0.1:8001, Node pipeline
#    worker on 127.0.0.1:3000. The old 127.0.0.1:8080/8081 matched nothing
#    (compose uses 8000 for the WSGI backend and 3000 for the worker).
#  - ADDED a port-80 server. The repo config had only a 443 server whose
#    Let's Encrypt certificates do not exist on a fresh instance, so nginx
#    could not start at all. HTTPS is a follow-up: point DNS at the instance
#    and run certbot, then append nginx.oracle-443-snippet.conf.
#
# Install: cp nginx.oracle.conf /etc/nginx/nginx.conf && nginx -t
# Expected smoke results (before real bindings / Stripe keys):
#   GET  /v1/payments/stripe/webhook        -> 405 post_required
#   POST /v1/payments/stripe/webhook (none) -> 401 missing_stripe_signature_header
#   GET  /healthz (any Host)                -> 200 process_alive
#   POST /api/auth/verify                   -> 503 authority_unavailable
#   POST /api/stream/transactions (public)  -> 403 (nginx allow-list)
#   GET  / (Host: sandersdashandseal.com)   -> 308 upgrade to https (app-level)

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # WebSocket upgrade mapping. The repo nginx.conf used $connection_upgrade
    # without defining it, so the original config fails `nginx -t`.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Direct-deploy upstreams (no Docker, no compose network).
    upstream transactional_core {
        server 127.0.0.1:8000;  # gunicorn wsgi:app (Stripe webhook)
    }

    upstream api_core {
        server 127.0.0.1:8001;  # gunicorn core_platform.deployment app
    }

    upstream pipeline_worker {
        server 127.0.0.1:3000;  # node worker/src/index.js
    }

    server {
        listen 80 default_server;
        server_name _;

        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_redirect off;
        client_header_timeout 10s;

        # Private stream route ONLY: OCI Function callers in the VCN subnet.
        location = /api/stream/transactions {
            allow 10.0.0.0/24;
            deny all;

            proxy_pass http://api_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Public API endpoints (no IP allow-list; the app enforces authority).
        location = /api/auth/verify {
            proxy_pass http://api_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /api/transactions/process {
            proxy_pass http://api_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/ {
            proxy_pass http://api_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Stripe webhook transport (webhook app only serves this path).
        location = /v1/payments/stripe/webhook {
            proxy_pass http://transactional_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            client_max_body_size 64k;
            client_body_buffer_size 64k;
            client_body_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        # Health endpoints with a canonical Host so the deployment app's host
        # gate does not 421 IP-based health checks. The app still answers
        # truthfully (200 process_alive / 503 not ready).
        location = /healthz {
            proxy_pass http://api_core;
            proxy_http_version 1.1;
            proxy_set_header Host sandersdashandseal.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /readyz {
            proxy_pass http://api_core;
            proxy_http_version 1.1;
            proxy_set_header Host sandersdashandseal.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /v1/telemetry/dashboard {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /ws/ {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 30s;
            proxy_read_timeout 360s;
            proxy_buffering off;
        }

        location /v1/telemetry/cast {
            proxy_pass http://pipeline_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 30s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        location /release-status.json {
            root /srv/sds/status;
        }

        location / {
            proxy_pass http://api_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
        }
    }
}
