name: Grantwriter register - record NSF Research.gov receipt (one-off 2026-11-27)
on:
  workflow_dispatch:
jobs:
  record-nsf:
    runs-on: ubuntu-latest
    steps:
      - name: Record the NSF Research.gov register state; read back receipt
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCS_OCI_HOST }}
          username: ${{ secrets.SCS_OCI_USER }}
          key: ${{ secrets.SCS_OCI_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set +e
            echo "=== STEP A: env handoff (values never printed) ==="
            sudo sh -c 'cat /etc/sanders-dash-seal/environment /etc/sanders-dash-seal/runtime.env > /tmp/sds_env_parsed 2>/dev/null; chown sanders:sanders /tmp/sds_env_parsed; chmod 600 /tmp/sds_env_parsed'
            echo "=== STEP B: record through production bindings ==="
            cat > /tmp/gw_record_nsf.json <<'JSONEOF'
            [{"system": "NSF_RESEARCH_GOV", "state": "VERIFIED", "basis": "Her NSF key is HELD for SANDERS HOME HEALTHCARE & CAREGIVERS LLC: the founder\u2019s NSF Research.gov account stands registered and activated (NSF ID 0000AB29V) and his Administrator role for the organization stands GRANTED and ACTIVE", "detail": "NSF Research.gov (research.gov): account of record created and activated 2026-11-27 (Roosevelt Sanders, rooseveltsanders381@gmail.com; NSF ID 0000AB29V). The organization was found by UEI QW8BRKNCF573 \u2014 NSF displays SANDERS HOME HEALTHCARE & CAREGIVERS LLC; it was not previously registered with NSF, and as the SAM point of contact the founder was required to obtain the Administrator role through this process. Organization record: short name \"Sanders Home Healthcare & Caregivers\", type Small Business, time zone America/Denver, phone 414-502-3325, email rooseveltsanders381@gmail.com, no fax. View My Roles of record: Administrator (Admin) under Active Role(s) \u2014 the role includes Sponsored Projects Officer (SPO) and View Only; granted on submission, no Requested Roles pending; NSF displays Date Added 11/28/2026 (UTC) for the grant made the evening of November 27, 2026 MST. Authorized Organizational Representative is not a separate selectable role in this flow; further roles may be requested now that Administrator is held. The register holds no credential", "verified_on": "2026-11-27"}]
            JSONEOF
            cat > /tmp/record_nsf.py <<'PYEOF'
            import json, os
            with open('/tmp/sds_env_parsed') as fh:
                for line in fh:
                    line = line.strip()
                    if not line or line.startswith('#') or '=' not in line:
                        continue
                    k, v = line.split('=', 1)
                    os.environ[k.strip()] = v.strip().strip('"').strip("'")
            os.environ.setdefault('SANDERS_RUNTIME_FACTORY', 'deploy.production_bindings:create_production_bindings')
            from deploy.production_bindings import create_production_bindings
            b = create_production_bindings()
            gw = b.grantwriter
            records = json.load(open('/tmp/gw_record_nsf.json'))
            def compact(entries):
                return [{'system': e['system'], 'state': e['state'], 'updated_by': e['updated_by'], 'updated_at': e['updated_at']} for e in entries]
            before_all = gw.access_register()
            print('REGISTER_BEFORE ' + json.dumps(compact(before_all), default=str))
            for rec in records:
                view = gw.record_access_state('RooseveltSanders', rec['system'], rec['state'], basis=rec['basis'], detail=rec['detail'], verified_on=rec['verified_on'])
                print('RECORDED ' + rec['system'] + ' ' + json.dumps(view, default=str))
            after_all = gw.access_register()
            print('REGISTER_AFTER ' + json.dumps(compact(after_all), default=str))
            for rec in records:
                after = [e for e in after_all if e['system'] == rec['system']]
                print('AFTER ' + rec['system'] + ' ' + json.dumps(after, default=str))
            PYEOF
            sudo -u sanders bash -c 'cd /opt/Sanders_Dash_Seal && PYTHONPATH=/opt/Sanders_Dash_Seal OPENSSL_CONF=/etc/pki/tls/sanders_fips.cnf ./venv/bin/python3 /tmp/record_nsf.py' 2>&1 | grep -E 'REGISTER_BEFORE|RECORDED |ALREADY_CURRENT|REGISTER_AFTER|AFTER |Error|Denied|denied|Traceback' | head -30
            sudo shred -u /tmp/sds_env_parsed 2>/dev/null || sudo rm -f /tmp/sds_env_parsed
            rm -f /tmp/record_nsf.py /tmp/gw_record_nsf.json
            echo "=== STEP C: audit receipt read-back ==="
            cat > /tmp/read_audit.py <<'PYEOF'
            import json, sqlite3
            db = sqlite3.connect('file:/opt/Sanders_Dash_Seal/data/audit.db?mode=ro', uri=True)
            rows = db.execute("SELECT seq, body, hash FROM receipts WHERE body LIKE '%GRANTWRITER_ACCESS_STATE_RECORDED%' ORDER BY seq DESC LIMIT 8;").fetchall()
            print('AUDIT_MATCHES', len(rows))
            for seq, body, h in rows:
                parsed = json.loads(body)
                print('AUDIT', seq, h, json.dumps(parsed.get('context'), default=str), parsed.get('timestamp'))
            PYEOF
            sudo -u sanders /opt/Sanders_Dash_Seal/venv/bin/python3 /tmp/read_audit.py 2>&1 | head -10
            rm -f /tmp/read_audit.py
            echo "GW_NSF_RECORD_DONE"
