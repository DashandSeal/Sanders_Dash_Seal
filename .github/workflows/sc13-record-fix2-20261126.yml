name: SC-13 lift - record production check (PYTHONPATH fix) + ML-KEM mixed-provider server test
on:
  workflow_dispatch:
jobs:
  fix2:
    runs-on: ubuntu-latest
    steps:
      - name: Record check with corrected path; test ML-KEM keygen under mixed providers server-side
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCS_OCI_HOST }}
          username: ${{ secrets.SCS_OCI_USER }}
          key: ${{ secrets.SCS_OCI_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set +e
            echo "=== STEP A: env handoff (values never printed) ==="
            sudo sh -c 'cat /etc/sanders-dash-seal/environment /etc/sanders-dash-seal/runtime.env > /tmp/sds_env_parsed 2>/dev/null; chown sanders:sanders /tmp/sds_env_parsed; chmod 600 /tmp/sds_env_parsed'
            echo "=== STEP B: record the production check ==="
            cat > /tmp/record_check.py <<'PYEOF'
            import json, os
            with open('/tmp/sds_env_parsed') as fh:
                for line in fh:
                    line = line.strip()
                    if not line or line.startswith('#') or '=' not in line:
                        continue
                    k, v = line.split('=', 1)
                    os.environ[k.strip()] = v.strip().strip('"').strip("'")
            os.environ.setdefault('SANDERS_RUNTIME_FACTORY', 'deploy.production_bindings:create_production_bindings')
            from deploy.production_bindings import create_production_bindings
            b = create_production_bindings()
            view = b.minotaur.record_crypto_environment_check('RooseveltSanders')
            print('RECORDED_CHECK ' + json.dumps(view, default=str))
            PYEOF
            sudo -u sanders bash -c 'cd /opt/Sanders_Dash_Seal && PYTHONPATH=/opt/Sanders_Dash_Seal OPENSSL_CONF=/etc/pki/tls/sanders_fips.cnf ./venv/bin/python3 /tmp/record_check.py' 2>&1 | grep -E 'RECORDED_CHECK|Error|Denied|denied|Traceback' | head -6
            sudo shred -u /tmp/sds_env_parsed 2>/dev/null || sudo rm -f /tmp/sds_env_parsed
            rm -f /tmp/record_check.py
            echo "=== STEP C: read back recorded checks ==="
            cat > /tmp/read_checks.py <<'PYEOF'
            import json, sqlite3
            db = sqlite3.connect('file:/opt/Sanders_Dash_Seal/data/minotaur.db?mode=ro', uri=True)
            db.row_factory = sqlite3.Row
            rows = db.execute('SELECT check_id, openssl_version, determination, fips_provider_state, recorded_by, recorded_at, receipt_id FROM minotaur_crypto_checks ORDER BY recorded_at').fetchall()
            print('TOTAL_CHECKS', len(rows))
            for r in rows[-2:]:
                print('CHECK', json.dumps(dict(r), default=str))
            PYEOF
            sudo -u sanders /opt/Sanders_Dash_Seal/venv/bin/python3 /tmp/read_checks.py 2>&1 | head -5
            rm -f /tmp/read_checks.py
            echo "=== STEP D: ML-KEM server-side keygen under the edge (mixed) config ==="
            CERT=/etc/letsencrypt/live/sandersdashandseal.com/fullchain.pem
            KEY=/etc/letsencrypt/live/sandersdashandseal.com/privkey.pem
            echo "--- D-ctl: s_server under STOCK config, client offers X25519MLKEM768 ---"
            (sudo timeout 10 openssl s_server -accept 18443 -cert $CERT -key $KEY -tls1_3 >/tmp/srv_ctl.log 2>&1 &)
            sleep 2
            echo | openssl s_client -connect 127.0.0.1:18443 -groups X25519MLKEM768 2>/dev/null | grep -iE 'Negotiated|Cipher is' | head -2
            sleep 9
            echo "--- D-edge: s_server under EDGE config, client offers X25519MLKEM768 ---"
            (sudo OPENSSL_CONF=/etc/pki/tls/sanders_fips_edge.cnf timeout 10 openssl s_server -accept 18444 -cert $CERT -key $KEY -tls1_3 >/tmp/srv_edge.log 2>&1 &)
            sleep 2
            echo | openssl s_client -connect 127.0.0.1:18444 -groups X25519MLKEM768 2>&1 | grep -iE 'Negotiated|Cipher is|error' | head -3
            sleep 9
            echo "--- server-side errors (edge) ---"
            grep -iE 'error|ml_kem|ML-KEM' /tmp/srv_edge.log 2>/dev/null | head -4
            sudo rm -f /tmp/srv_ctl.log /tmp/srv_edge.log
            echo "FIX2_DONE"
