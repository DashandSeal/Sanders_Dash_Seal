name: Sanders Dash & Seal production readiness evidence audit
on:
  push:
    branches: [build/security-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify repository evidence without inventing external authorization
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, os
          root=pathlib.Path('.')
          checks=[]
          for folder in ('core_platform','tests'):
              for p in sorted((root/folder).rglob('*.py')):
                  m=pathlib.Path(str(p)+'.pbd.json')
                  ok=False
                  if m.exists():
                      try:
                          obj=json.loads(m.read_text())
                          ok=(obj['body']['artifact']==p.as_posix() and
                              obj['body']['payload_hash']==hashlib.sha256(p.read_bytes()).hexdigest())
                      except (KeyError,ValueError,TypeError):
                          pass
                  checks.append({'control':'source_pbd_pair','artifact':p.as_posix(),'passed':ok})
          required=['authenticated_customer_workflow','jurisdiction_authority_service',
                    'humanitarian_policy_enforcement','independent_twin_gate_signers',
                    'production_pbd_signatures','vault_network_isolation',
                    'external_immutable_glass_box_audit','production_runtime',
                    'stripe_live_webhook_end_to_end','signwell_enotary_integration',
                    'bluenotary_ron_integration','independent_quality_verification',
                    'end_to_end_recovery_and_revocation']
          for item in required:
              checks.append({'control':item,'status':'NOT_OBSERVED',
                             'reason':'This source-only job does not observe the deployed service'})
          result={'platform':'Sanders Dash & Seal',
                  'verdict':'OBSERVATION_ONLY',
                  'source_checks_passed':all(x['passed'] for x in checks if x['control']=='source_pbd_pair'),
                  'production_evidence_status':'NOT_OBSERVED',
                  'checks':checks}
          out=pathlib.Path('production-readiness-report.json')
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Sanders Dash & Seal production readiness\n\n')
              f.write('**Source observations only — this report neither authorizes nor blocks installation.**\n\n')
              f.write(f"Source manifest pairing: {'PASS' if result['source_checks_passed'] else 'FAIL'}\n\n")
              f.write('External production evidence: **NOT OBSERVED BY THIS JOB**.\n')
          print(json.dumps({'verdict':result['verdict'],'source_checks_passed':result['source_checks_passed']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-readiness-evidence
          path: production-readiness-report.json
          retention-days: 90
