name: simultaneous master deploy - sanders_dash_seal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-legal-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DashandSeal/Sanders_Dash_Seal
        uses: actions/checkout@v4

      - name: The Police Men RTSA — Zero-Secret Leak Guard (PAT + ghs_ Stateless JWT)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          token_re = re.compile(
              r'(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9.\-_]{36,})'
          )
          privkey_re = re.compile(
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----[\r\n]+[A-Za-z0-9+/=]{24,}'
          )

          leaks = []
          for p in pathlib.Path('.').rglob('*'):
              if '.git' in p.parts or not p.is_file():
                  continue
              if p.as_posix() in ('rtsa_police_men/status.json', '.github/workflows/deploy_all_simultaneous.yml'):
                  continue
              try:
                  text = p.read_text(errors='ignore')
              except Exception:
                  continue
              if token_re.search(text) or privkey_re.search(text):
                  leaks.append(str(p))

          if leaks:
              print("CRITICAL BLOCK: Raw token, ghs_ S2S JWT, or private key payload detected in:", ", ".join(leaks))
              sys.exit(1)
          print("VERIFIED: Zero raw PATs, ghs_ stateless/stateful tokens, or private keys in repository.")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Native Build Tools & Dependencies
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --fix-missing cmake gcc g++ ninja-build libssl-dev
          fi
          if [ -f "money_factory_legal_aid_v1_668/requirements.txt" ]; then
            pip install -r money_factory_legal_aid_v1_668/requirements.txt
          fi

      - name: Verify Money Factory Legal Aid v1.668 Hard-Lock & ML-DSA-65
        run: |
          if [ -f "money_factory_legal_aid_v1_668/shield/sovereign_shield_v3.py" ]; then
            PYTHONPATH=money_factory_legal_aid_v1_668 python3 -c 'from shield.sovereign_shield_v3 import SovereignShieldV3; s = SovereignShieldV3("CI-MASTER-01", "US-CO-COS"); coc = s.generate_lattice_coc({"case": "master_deploy"}, "a" * 64, "561110"); assert coc["court_admissibility_status"] == "VERIFIED_IMMUTABLE_2026"; print("VERIFIED:", coc["pqc_algorithm"], coc["court_admissibility_status"])'
          fi

  deploy-all-to-oci:
    needs: verify-legal-engine
    runs-on: ubuntu-latest
    environment: Production-Authorization-Gate
    steps:
      - name: Simultaneous Full-Repository Deploy on Oracle Linux 9
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SCS_OCI_HOST }}
          username: ${{ secrets.SCS_OCI_USER }}
          key: ${{ secrets.SCS_OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            REPO_DIR="/opt/Sanders_Dash_Seal"

            # 0. Bootstrap git, Nginx, Python 3.12, and native C build tools on Oracle Linux 9
            sudo dnf install -y git nginx cmake gcc-c++ make openssl-devel python3.12 python3.12-devel

            # 1. Clone or sync entire DashandSeal/Sanders_Dash_Seal repository
            if [ ! -d "$REPO_DIR/.git" ]; then
              sudo mkdir -p "$REPO_DIR"
              sudo chown -R "$USER:$USER" "$REPO_DIR"
              git clone https://github.com/DashandSeal/Sanders_Dash_Seal.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            # 2. Ensure Python 3.12 virtual environment & install all repo + Legal Engine dependencies
            if [ ! -d "$REPO_DIR/venv" ]; then
              python3.12 -m venv "$REPO_DIR/venv" || python3 -m venv "$REPO_DIR/venv"
            fi
            source "$REPO_DIR/venv/bin/activate"
            pip install --upgrade pip
            [ -f requirements.txt ] && pip install -r requirements.txt || true
            [ -f requirements-server.txt ] && pip install -r requirements-server.txt || true
            [ -f money_factory_legal_aid_v1_668/requirements.txt ] && pip install -r money_factory_legal_aid_v1_668/requirements.txt || true

            # 3. Register liboqs shared libraries globally & allow Nginx localhost proxying under SELinux
            printf "/usr/local/lib64\n/usr/local/lib\n" | sudo tee /etc/ld.so.conf.d/liboqs.conf >/dev/null
            sudo ldconfig
            if command -v setsebool >/dev/null 2>&1; then
              sudo setsebool -P httpd_can_network_connect 1 || true
            fi

            # 4. Install Money Factory Legal Aid v1.668 systemd & Nginx reverse proxy
            if [ -f money_factory_legal_aid_v1_668/infra/oracle_linux_9/money-factory-legal.service ]; then
              sudo cp money_factory_legal_aid_v1_668/infra/oracle_linux_9/money-factory-legal.service /etc/systemd/system/
              sudo mkdir -p /etc/systemd/system/money-factory-legal.service.d
              sudo tee /etc/systemd/system/money-factory-legal.service.d/override.conf >/dev/null <<'OVERRIDE'
            [Service]
            Environment="LD_LIBRARY_PATH=/usr/local/lib64:/usr/local/lib"
            OVERRIDE
            fi

            # 4b. Sync The Police Men RTSA (Security Upgrades & CSPU Governance) assets
            sudo mkdir -p /var/www/rtsa /usr/share/nginx/html
            if [ -d "$REPO_DIR/rtsa_police_men" ]; then
              sudo cp "$REPO_DIR/rtsa_police_men/index.html" /usr/share/nginx/html/index.html
              sudo cp "$REPO_DIR/rtsa_police_men/status.json" /var/www/rtsa/status.json
            fi

            sudo mkdir -p /etc/nginx/conf.d /etc/nginx/snippets
            sudo sed -i 's/default_server//g' /etc/nginx/nginx.conf || true
            sudo sed -i 's/server_name[[:space:]]\+_;$/server_name localhost;/g' /etc/nginx/nginx.conf || true

            if [ -f money_factory_legal_aid_v1_668/infra/oracle_linux_9/money_factory_legal.conf ]; then
              sudo cp money_factory_legal_aid_v1_668/infra/oracle_linux_9/money_factory_legal.conf /etc/nginx/snippets/money_factory_legal.conf
              if [ ! -f /etc/letsencrypt/live/sandersdashandseal.com/fullchain.pem ]; then
                sudo tee /etc/nginx/conf.d/money_factory_legal_server.conf >/dev/null <<'NGINX'
            server {
                listen 80 default_server;
                server_name sandersdashandseal.com www.sandersdashandseal.com 129.146.111.166 _;
                root /usr/share/nginx/html;
                index index.html;

                server_tokens off;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;

                location = / {
                    try_files /index.html =404;
                }

                location = /rtsa/status {
                    default_type application/json;
                    alias /var/www/rtsa/status.json;
                }

                include /etc/nginx/snippets/money_factory_legal.conf;
            }
            NGINX
              fi
            fi

            # 5. Open HTTP/HTTPS firewalld ports & explicitly enable/restart core services
            if systemctl is-active --quiet firewalld; then
              sudo firewall-cmd --permanent --add-service=http || true
              sudo firewall-cmd --permanent --add-service=https || true
              sudo firewall-cmd --reload || true
            fi
            sudo systemctl daemon-reload
            sudo nginx -t

            sudo systemctl enable --now money-factory-legal.service
            sudo systemctl restart money-factory-legal.service
            sudo systemctl enable --now nginx.service
            sudo systemctl restart nginx.service

            for svc in sanders-dash-seal.service gunicorn.service; do
              if systemctl list-unit-files "$svc" | grep -q "$svc"; then
                sudo systemctl enable --now "$svc" || true
                sudo systemctl restart "$svc" || true
              fi
            done

            # 6. Bring up Docker Compose stacks if Docker is installed
            if command -v docker >/dev/null 2>&1 && [ -f compose.yaml ]; then
              docker compose up -d --build || true
            fi

            # 7. Automated End-to-End Health, RTSA & ML-DSA-65 Smoke Test on OCI
            HEALTH_OK=0
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1/legal-aid/health && curl -fsS http://127.0.0.1/rtsa/status >/dev/null; then
                HEALTH_OK=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "=== DIAGNOSTICS: money-factory-legal.service ==="
              sudo systemctl status money-factory-legal.service --no-pager -l || true
              sudo journalctl -u money-factory-legal.service -n 30 --no-pager || true
              exit 1
            fi

            echo ""
            echo "SIMULTANEOUS DEPLOY COMPLETE: The Police Men RTSA & Sanders_Dash_Seal active."
