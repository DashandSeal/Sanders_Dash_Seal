name: Sanders Dash & Seal parallel platform and sidecar verification
on:
  push:
    branches: [build/security-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parallel-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete server test dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Platform case and payment tests
        run: |
          python -m unittest discover -s tests -p 'test_cases.py' -v
          python -m unittest discover -s tests -p 'test_stripe*.py' -v
  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete server test dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Sidecar and hot-swap tests
        run: |
          python -m unittest discover -s tests -p 'test_upgrade_sidecar.py' -v
          python -m unittest discover -s tests -p 'test_hotswap.py' -v
  integration:
    needs: [platform, sidecar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete server test dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Verify every executable has a paired matching PBD hash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          errors = []
          for root in ('core_platform', 'tests'):
              for path in pathlib.Path(root).rglob('*.py'):
                  manifest = pathlib.Path(str(path) + '.pbd.json')
                  if not manifest.exists():
                      errors.append(f'{path}: missing paired manifest')
                      continue
                  try:
                      obj = json.loads(manifest.read_text())
                      body = obj['body']
                      if body.get('artifact') != path.as_posix():
                          errors.append(f'{path}: artifact identity mismatch')
                      if body.get('payload_hash') != hashlib.sha256(path.read_bytes()).hexdigest():
                          errors.append(f'{path}: SHA256 mismatch')
                  except (ValueError, KeyError) as exc:
                      errors.append(f'{path}: invalid manifest {exc}')
          if errors:
              sys.exit('\n'.join(errors))
          print('Platform and sidecar executable hashes match; signature authority is evaluated by privileged operations')
          PY
      - name: Run complete development suite
        run: python -m unittest discover -s tests -v
