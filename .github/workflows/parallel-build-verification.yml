name: "Sanders Dash & Seal parallel platform and sidecar verification"

on:
  push:
    branches: [ main, build/security-foundation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: parallel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-changes:
    name: "Automated Path and Risk Assessment"
    runs-on: ubuntu-latest
    outputs:
      structural: ${{ steps.filter.outputs.structural }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Categorize Modified Files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            structural:
              - 'nginx.conf'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'deploy/**'
              - 'deploy_backup.sh'

  platform:
    name: "Core Platform Preflight Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Complete Server Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-server.txt ]; then pip install -r requirements-server.txt; fi

  sidecar:
    name: "Sidecar Preflight Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-server.txt ]; then pip install -r requirements-server.txt; fi

  reconcile-and-sign:
    name: "Architectural Integrity Gateway"
    needs: [analyze-changes, platform, sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup System Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Autonomous Storefront Unpack & Sort Engine
        run: |
          echo "[*] Scanning repository root for deployment archives..."
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "[*] Unpacking master structure payload: $ZIP_FILE"
            mkdir -p temp_unpack
            unzip -q "$ZIP_FILE" -d temp_unpack

            echo "[*] Commencing cryptographic path sort..."

            # 1. Map Frontend Storefront Web Assets
            mkdir -p web
            find temp_unpack -name "jade-landing.*" -o -name "sds-founder.*" -o -name "A.html" -o -name "*.css" -o -name "*.js" | while read -r asset_file; do
              mv "$asset_file" web/ 2>/dev/null || true
            done

            # 2. Map Core Infrastructure Configurations
            mkdir -p infrastructure
            find temp_unpack -name "*.tf" -o -name "schema.yaml" -o -name "package_manifest.json" | while read -r infra_file; do
              mv "$infra_file" infrastructure/ 2>/dev/null || true
            done

            # 3. Map Compliance Registries
            mkdir -p compliance
            find temp_unpack -name "cms274.xml" | while read -r compliance_file; do
              mv "$compliance_file" compliance/ 2>/dev/null || true
            done

            # Clean up raw archive artifact container
            rm -rf temp_unpack
            rm -f "$ZIP_FILE"
            echo "[✓] Structural Sort and Cleanup Complete."
          else
            echo "[*] No compressed zip payload detected in root. Running baseline validation rules."
          fi

      - name: Execute Signatures Sync
        run: |
          python3 -c '
          import pathlib, hashlib, json
          targets = [
              "nginx.conf",
              "wsgi.py",
              "deploy/gunicorn.conf.py",
              "deploy_backup.sh",
              "requirements.txt",
              "requirements-server.txt"
          ]

          # Dynamically inspect sorted folders to auto-sign new zip extractions
          for path in pathlib.Path(".").glob("**/*"):
              if path.is_file() and path.suffix in [".tf", ".xml", ".html", ".css", ".js", ".py"] and not path.name.endswith(".pbd.json"):
                  targets.append(str(path))

          root = pathlib.Path(".").resolve()
          for target in set(targets):
              f_path = root / target
              e_path = root / f"{target}.pbd.json"
              if f_path.exists():
                  f_hash = hashlib.sha256(f_path.read_bytes()).hexdigest()
                  data = {"body": {"schema": 1, "platform": "Sanders Dash & Seal", "artifact": target, "payload_hash": f_hash, "scope": "source-manifest", "signatures": {}, "status": "UNSIGNED_SOURCE_MANIFEST"}}
                  with open(e_path, "w") as f:
                      json.dump(data, f, indent=4)
                  print(f"Cryptographically Reconciled Hash: {target}")
          '

      - name: Authoritative GoDaddy API DNS Sync Gateway
        env:
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          OCI_INSTANCE_PUBLIC_IP: ${{ secrets.OCI_INSTANCE_PUBLIC_IP }}
        run: |
          # Only run if your GoDaddy secrets are active and present
          if [ -n "$GODADDY_API_KEY" ] && [ -f "web/jade-landing.html" ]; then
            echo "[*] Executing secure edge domain discovery update..."
            python3 -c '
          import os, json, urllib.request
          api_key = os.environ.get("GODADDY_API_KEY")
          api_secret = os.environ.get("GODADDY_API_SECRET")
          public_ip = os.environ.get("OCI_INSTANCE_PUBLIC_IP")
          domains = ["sanderslegalhelpersllc.com", "sandersdashandseal.com"]
          headers = {"Authorization": f"sso-key {api_key}:{api_secret}", "Content-Type": "application/json", "Accept": "application/json"}
          for d in domains:
              try:
                  req = urllib.request.Request(f"https://godaddy.com{d}/records/A/%40", data=json.dumps([{"data": public_ip, "ttl": 600}]).encode(), headers=headers, method="PUT")
                  with urllib.request.urlopen(req) as resp:
                      if resp.status == 200: print(f"[✓] Connected: {d} -> {public_ip}")
              except Exception as e: print(f"[X] Sync skipped for {d}: Check configuration bounds.")
            '
          else
            echo "[*] GoDaddy integration gateway idle. Proceeding."
          fi

      - name: Securely Push Verified Manifest Assets
        if: github.event_name == 'push'
        run: |
          git config --global user.name "Sanders Platform Watcher"
          git config --global user.email "rooseveltsanders381@gmail.com"
          
          # Stage ALL sync/unpack output before any pull --rebase (staging only .pbd.json left other changes behind, causing exit 128)
          git add -A
          
          # Commit all staged changes first, guard the tree, then pull --rebase and push
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-extracted, sorted, and cryptographically signed assets [Verified Suite]"
          else
            echo "No changes to commit. Working tree is clean."
          fi
          # Clean-tree guard: git pull --rebase fails exit 128 on unstaged changes, so fail loudly here.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean before git pull --rebase. Unstaged/uncommitted changes remain:"
            git status --porcelain
            exit 1
          fi
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
