name: Diagnose Secretary 203-EXEC (one-time)
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Dump Secretary service state
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCS_OCI_HOST }}
          username: ${{ secrets.SCS_OCI_USER }}
          key: ${{ secrets.SCS_OCI_SSH_KEY }}
          port: 22
          script: |
            set +e
            echo "=== WHOAMI / ID ==="
            id; echo "HOME=$HOME"
            echo "=== SELINUX ==="
            getenforce 2>&1; sestatus 2>&1 | head -n 20
            echo "=== UNIT FILE (full) ==="
            sudo cat /etc/systemd/system/sanders-corporations-secretary.service 2>&1 || echo "UNIT FILE MISSING"
            echo "=== VENV BIN (modes, owners, SELinux context) ==="
            ls -la /home/opc/.local/share/sanders-corporations-secretary/venv/bin/ 2>&1
            ls -laZ /home/opc/.local/share/sanders-corporations-secretary/venv/bin/ 2>&1 | head -n 30
            echo "=== PATH TRAVERSAL ==="
            namei -l /home/opc/.local/share/sanders-corporations-secretary/venv/bin/uvicorn 2>&1
            echo "=== UVICORN SHEBANG + INTERPRETER ==="
            head -n 1 /home/opc/.local/share/sanders-corporations-secretary/venv/bin/uvicorn 2>&1
            ls -l /home/opc/.local/share/sanders-corporations-secretary/venv/bin/python* 2>&1
            /home/opc/.local/share/sanders-corporations-secretary/venv/bin/python --version 2>&1
            /home/opc/.local/share/sanders-corporations-secretary/venv/bin/uvicorn --version 2>&1
            echo "=== SERVICE STATUS ==="
            sudo systemctl status sanders-corporations-secretary.service --no-pager 2>&1 | head -n 40
            echo "=== JOURNAL (last 50) ==="
            sudo journalctl -u sanders-corporations-secretary.service -n 50 --no-pager 2>&1
            echo "=== SELINUX AVC DENIALS (last hour) ==="
            sudo ausearch -m avc -ts recent 2>&1 | tail -n 40 || sudo grep -i avc /var/log/audit/audit.log 2>&1 | tail -n 40 || echo "NO AUDIT LOG ACCESS"
            echo "=== LISTENING (8791/8792) ==="
            ss -ltnp 2>/dev/null | grep -E '8791|8792' || echo "NOTHING ON 8791/8792"
            echo "DIAGNOSE_DONE"
