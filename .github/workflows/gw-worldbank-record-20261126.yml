name: Grantwriter register - record WORLD_BANK_VMP submitted state (one-off 2026-11-26)
on:
  workflow_dispatch:
jobs:
  record-worldbank:
    runs-on: ubuntu-latest
    steps:
      - name: Record WORLD_BANK_VMP SUBMITTED through the register machinery; read back
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCS_OCI_HOST }}
          username: ${{ secrets.SCS_OCI_USER }}
          key: ${{ secrets.SCS_OCI_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set +e
            echo "=== STEP A: env handoff (values never printed) ==="
            sudo sh -c 'cat /etc/sanders-dash-seal/environment /etc/sanders-dash-seal/runtime.env > /tmp/sds_env_parsed 2>/dev/null; chown sanders:sanders /tmp/sds_env_parsed; chmod 600 /tmp/sds_env_parsed'
            echo "=== STEP B: record through production bindings ==="
            cat > /tmp/record_worldbank.py <<'PYEOF'
            import json, os
            with open('/tmp/sds_env_parsed') as fh:
                for line in fh:
                    line = line.strip()
                    if not line or line.startswith('#') or '=' not in line:
                        continue
                    k, v = line.split('=', 1)
                    os.environ[k.strip()] = v.strip().strip('"').strip("'")
            os.environ.setdefault('SANDERS_RUNTIME_FACTORY', 'deploy.production_bindings:create_production_bindings')
            from deploy.production_bindings import create_production_bindings
            b = create_production_bindings()
            gw = b.grantwriter
            BASIS = "Her third global key: the founder\u2019s World Bank Vendor Management Portal account is held (rooseveltsanders381@gmail.com, signed in via Google \u2014 no credential of its own was created) and the vendor application of SANDERS HOME HEALTHCARE & CAREGIVERS LLC stands SUBMITTED 2026-11-26; Application Number VMP0016761; submitted, not yet approved \u2014 the World Bank reviews; the founder made the conflict-of-interest attestation and the submission himself"
            DETAIL = "World Bank Vendor Management Portal (vmp-ext.worldbank.org): vendor application of record \u2014 establishment date 08/27/2025 (founder-confirmed); categories MEDICAL: SERVICES and CONTRACT CONSULTANTS: CONSULTING: FIRMS FOR OPERATIONAL PROJECTS; company, contact and questionnaire fully filled and saved before submission; both WBG conflict questions answered No; no demographic ownership categories claimed; no tax ID was requested or entered at any step; the account is the founder\u2019s Google sign-in and no credential is recorded here"
            def compact(entries):
                return [{'system': e['system'], 'state': e['state'], 'updated_by': e['updated_by'], 'updated_at': e['updated_at']} for e in entries]
            before_all = gw.access_register()
            print('REGISTER_BEFORE ' + json.dumps(compact(before_all), default=str))
            before = [e for e in before_all if e['system'] == 'WORLD_BANK_VMP']
            print('BEFORE ' + json.dumps(before, default=str))
            if before and before[0]['state'] == 'SUBMITTED' and before[0]['basis'] == BASIS and before[0]['detail'] == DETAIL and before[0]['updated_by'] == 'RooseveltSanders':
                print('ALREADY_CURRENT')
            else:
                view = gw.record_access_state('RooseveltSanders', 'WORLD_BANK_VMP', 'SUBMITTED', basis=BASIS, detail=DETAIL, verified_on='2026-11-26')
                print('RECORDED ' + json.dumps(view, default=str))
            after_all = gw.access_register()
            print('REGISTER_AFTER ' + json.dumps(compact(after_all), default=str))
            after = [e for e in after_all if e['system'] == 'WORLD_BANK_VMP']
            print('AFTER ' + json.dumps(after, default=str))
            PYEOF
            sudo -u sanders bash -c 'cd /opt/Sanders_Dash_Seal && PYTHONPATH=/opt/Sanders_Dash_Seal OPENSSL_CONF=/etc/pki/tls/sanders_fips.cnf ./venv/bin/python3 /tmp/record_worldbank.py' 2>&1 | grep -E 'REGISTER_BEFORE|BEFORE |RECORDED |ALREADY_CURRENT|REGISTER_AFTER|AFTER |Error|Denied|denied|Traceback' | head -10
            sudo shred -u /tmp/sds_env_parsed 2>/dev/null || sudo rm -f /tmp/sds_env_parsed
            rm -f /tmp/record_worldbank.py
            echo "=== STEP C: audit receipt read-back ==="
            cat > /tmp/read_audit.py <<'PYEOF'
            import json, sqlite3
            db = sqlite3.connect('file:/opt/Sanders_Dash_Seal/data/audit.db?mode=ro', uri=True)
            rows = db.execute("SELECT seq, body, hash FROM receipts WHERE body LIKE '%GRANTWRITER_ACCESS_STATE_RECORDED%' ORDER BY seq DESC LIMIT 3;").fetchall()
            print('AUDIT_MATCHES', len(rows))
            for seq, body, h in rows:
                parsed = json.loads(body)
                print('AUDIT', seq, h, json.dumps(parsed.get('context'), default=str), parsed.get('timestamp'))
            PYEOF
            sudo -u sanders /opt/Sanders_Dash_Seal/venv/bin/python3 /tmp/read_audit.py 2>&1 | head -5
            rm -f /tmp/read_audit.py
            echo "GW_WORLDBANK_RECORD_DONE"
