name: HTTPS setup - Oracle

on:
  workflow_dispatch:

jobs:
  https-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up HTTPS on Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCS_OCI_HOST }}
          username: ${{ secrets.SCS_OCI_USER }}
          key: ${{ secrets.SCS_OCI_SSH_KEY }}
          port: 22
          script: |
            set -e
            cat /etc/os-release
            python3 --version
            echo '=== Firewall before ==='
            sudo firewall-cmd --list-all
            sudo firewall-cmd --add-port=8000/tcp --permanent
            sudo firewall-cmd --add-port=80/tcp --permanent
            sudo firewall-cmd --add-port=443/tcp --permanent
            sudo firewall-cmd --reload
            echo '=== Firewall after ==='
            sudo firewall-cmd --list-all
            echo '=== Install certbot ==='
            sudo dnf install -y oracle-epel-release.el8 || sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm || sudo dnf install -y epel-release || true
            sudo dnf install -y certbot python3-certbot-nginx || sudo dnf install -y certbot-nginx || (sudo dnf install -y python3-pip; sudo python3 -m pip install --upgrade certbot certbot-nginx)
            if [ -x /usr/local/bin/certbot ]; then sudo ln -sf /usr/local/bin/certbot /usr/bin/certbot; fi
            sudo certbot --version
            echo '=== Diagnostics before fix ==='
            sudo ls -l /etc/nginx/conf.d/
            sudo nginx -T 2>&1 | grep -E "^# configuration file|server_name|listen" | head -n 80 || true
            echo '--- money_factory file ---'
            sudo cat /etc/nginx/conf.d/money_factory_legal_server.conf
            echo '--- 00-sanders file ---'
            sudo cat /etc/nginx/conf.d/00-sanders_dash_seal.conf || true
            echo '--- snippet file ---'
            sudo cat /etc/nginx/snippets/money_factory_legal.conf
            echo '--- app root direct ---'
            curl -s http://127.0.0.1:8000/ | head -c 500; echo ''
            echo '--- site root over HTTPS ---'
            curl -s https://sandersdashandseal.com/ | head -c 500; echo ''
            echo '--- legal-aid over HTTPS ---'
            curl -s -o /dev/null -w '%{http_code}\n' https://sandersdashandseal.com/legal-aid/
            echo '--- rtsa status over HTTPS ---'
            curl -s https://sandersdashandseal.com/rtsa/status; echo ''
            echo '=== Fix: add app proxy to the snippet included by the winning money_factory block ==='
            echo 'money_factory_legal_server.conf is NOT edited or deleted. Its snippet already defines /legal-aid/ and /rtsa/status; appending /healthz and / proxy locations to the snippet makes the winning server block proxy the app, while its exact location = / and the legal locations keep precedence.'
            sudo cp /etc/nginx/snippets/money_factory_legal.conf /tmp/money_factory_legal.conf.bak
            if ! sudo grep -q "location /healthz" /etc/nginx/snippets/money_factory_legal.conf; then
              cat <<'SNIPPETEOF' | sudo tee -a /etc/nginx/snippets/money_factory_legal.conf
            location /healthz {
                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            location / {
                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            SNIPPETEOF
            fi
            sudo rm -f /etc/nginx/conf.d/00-sanders_dash_seal.conf /etc/nginx/conf.d/sanders_dash_seal.conf
            sudo ls -l /etc/nginx/conf.d/
            sudo cat /etc/nginx/snippets/money_factory_legal.conf
            if ! sudo nginx -t; then sudo cp /tmp/money_factory_legal.conf.bak /etc/nginx/snippets/money_factory_legal.conf; echo 'RESTORED snippet after nginx -t failure'; exit 1; fi
            sudo systemctl reload nginx
            echo '=== Health check localhost:8000 ==='
            curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/healthz
            echo '=== Health check port 80 ==='
            curl -s -i http://sandersdashandseal.com/healthz | head -n 20
            echo ''
            sudo /usr/local/bin/certbot --nginx -d sandersdashandseal.com -d www.sandersdashandseal.com --non-interactive --agree-tos -m rooseveltsanders381@gmail.com --redirect --reinstall || sudo certbot --nginx -d sandersdashandseal.com -d www.sandersdashandseal.com --non-interactive --agree-tos -m rooseveltsanders381@gmail.com --redirect --reinstall
            echo '=== Final HTTPS health check ==='
            curl -s https://sandersdashandseal.com/healthz
            echo ''
            curl -s -o /dev/null -w '%{http_code}\n' https://sandersdashandseal.com/healthz
            echo '=== Final port 8000 health check ==='
            curl -s -o /dev/null -w '%{http_code}\n' http://129.146.111.166:8000/healthz
            echo '=== Probes after fix ==='
            curl -s https://sandersdashandseal.com/ | head -c 500; echo ''
            curl -s -o /dev/null -w '%{http_code}\n' https://sandersdashandseal.com/legal-aid/
            curl -s https://sandersdashandseal.com/rtsa/status; echo ''
            sudo nginx -t
