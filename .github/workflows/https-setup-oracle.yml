name: HTTPS setup - Oracle

on:
  workflow_dispatch:

jobs:
  https-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up HTTPS on Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCS_OCI_HOST }}
          username: ${{ secrets.SCS_OCI_USER }}
          key: ${{ secrets.SCS_OCI_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo '=== Firewall before ==='
            sudo firewall-cmd --list-all
            sudo firewall-cmd --add-port=8000/tcp --permanent
            sudo firewall-cmd --add-port=80/tcp --permanent
            sudo firewall-cmd --add-port=443/tcp --permanent
            sudo firewall-cmd --reload
            echo '=== Firewall after ==='
            sudo firewall-cmd --list-all
            echo '=== Enable EPEL (certbot is in EPEL on Oracle Linux) ==='
            sudo dnf install -y oracle-epel-release.el8 || sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm || sudo dnf install -y epel-release
            sudo dnf install -y certbot python3-certbot-nginx || sudo dnf install -y certbot-nginx
            cat <<'NGINXEOF' | sudo tee /etc/nginx/conf.d/sanders_dash_seal.conf
            server {
                listen 80;
                server_name sandersdashandseal.com www.sandersdashandseal.com;
                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINXEOF
            sudo nginx -t && sudo systemctl reload nginx
            echo '=== Health check localhost:8000 ==='
            curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/healthz
            echo '=== Health check port 80 ==='
            curl -s http://sandersdashandseal.com/healthz
            echo ''
            sudo certbot --nginx -d sandersdashandseal.com -d www.sandersdashandseal.com --non-interactive --agree-tos -m rooseveltsanders381@gmail.com --redirect
            echo '=== Final HTTPS health check ==='
            curl -s https://sandersdashandseal.com/healthz
            echo ''
            echo '=== Final port 8000 health check ==='
            curl -s -o /dev/null -w '%{http_code}\n' http://129.146.111.166:8000/healthz
