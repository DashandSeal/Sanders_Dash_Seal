name: Repair deployment.py and SAN check (one-time)
on:
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - name: Check out repo with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore deployment.py, add six domains, fix SAN check
        run: |
          set -e
          echo "=== CURRENT deployment.py ==="
          wc -l deploy/deployment.py || true
          echo "=== RESTORE FULL FILE FROM PARENT OF BAD COMMIT 3017229 ==="
          git show 3017229^:deploy/deployment.py > deploy/deployment.py
          LINES=$(wc -l < deploy/deployment.py)
          echo "restored lines: $LINES"
          if [ "$LINES" -lt 600 ]; then echo "RESTORE_FAILED lines=$LINES"; exit 1; fi
          grep -c "def create_application" deploy/deployment.py
          grep -c "host_denied" deploy/deployment.py
          echo "=== APPLY ALIAS_HOSTS EDIT ==="
          python3 - <<'PYEOF'
          import pathlib, re
          p = pathlib.Path('deploy/deployment.py')
          text = p.read_text()
          new_line = "ALIAS_HOSTS = {'www.sandersdashandseal.com', 'sanderslegalhelpersllc.com', 'www.sanderslegalhelpersllc.com', 'sanderssixshield.com', 'www.sanderssixshield.com', 'sanderssecurestack.com', 'www.sanderssecurestack.com', 'sandersemergencyglobalcommunication.com', 'www.sandersemergencyglobalcommunication.com'}"
          text2, n = re.subn(r"^ALIAS_HOSTS = \{.*\}$", new_line, text, count=1, flags=re.M)
          assert n == 1, "ALIAS_HOSTS line not replaced"
          p.write_text(text2)
          print("ALIAS_HOSTS replaced")
          PYEOF
          echo "=== FIX SAN CHECK ==="
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('.github/workflows/add-three-domains-cert-nginx-20261121.yml')
          text = p.read_text()
          old = 'for c in /etc/letsencrypt/live/*/cert.pem; do echo "--- $c ---"; sudo openssl x509 -in "$c" -noout -subject -dates -ext subjectAltName 2>/dev/null || sudo openssl x509 -in "$c" -noout -text | grep -A1 "Subject Alternative Name"; done'
          new = 'sudo openssl x509 -in /etc/letsencrypt/live/sandersdashandseal.com/cert.pem -noout -subject -dates -ext subjectAltName'
          assert old in text, "SAN loop line not found"
          p.write_text(text.replace(old, new, 1))
          print("SAN check fixed to explicit cert path")
          PYEOF
          echo "=== VERIFY ==="
          wc -l deploy/deployment.py
          grep -n "^ALIAS_HOSTS" deploy/deployment.py
          grep -c "def create_application" deploy/deployment.py
          grep -c "host_denied" deploy/deployment.py
          python3 -m py_compile deploy/deployment.py && echo "py_compile OK"
          python3 - <<'PYEOF'
          try:
              import yaml
              d = yaml.safe_load(open('.github/workflows/add-three-domains-cert-nginx-20261121.yml'))
              print('workflow YAML OK:', d['name'])
          except ImportError:
              print('pyyaml not available, skipping YAML parse check')
          PYEOF
          grep -n "letsencrypt/live/sandersdashandseal.com/cert.pem" .github/workflows/add-three-domains-cert-nginx-20261121.yml
          echo "=== COMMIT + PUSH ==="
          git config user.name "DashandSeal"
          git config user.email "rooseveltsanders381@gmail.com"
          git add deploy/deployment.py .github/workflows/add-three-domains-cert-nginx-20261121.yml
          git status --short
          git commit -m "Restore deploy/deployment.py and add six new domains to ALIAS_HOSTS; fix SAN check path"
          git push origin main
          echo "REPAIR_DONE"
          git log --oneline -3
