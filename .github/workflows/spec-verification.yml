name: Sanders Dash & Seal — source verification
on:
  push:
    branches:
      - build/security-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-development-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked development dependency
        run: python -m pip install -r requirements-server.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install and verify locked worker dependency
        working-directory: worker
        run: |
          npm ci --ignore-scripts
      - name: Check original governance text and executable pairing
        shell: python
        run: |
          from pathlib import Path
          from hashlib import sha256
          import json
          root = Path('.')
          governance = (root / 'docs/GOVERNANCE.md').read_text()
          original = [
              'Do no harm to humans, humanity itself.',
              'Never be weaponized under any circumstances.',
              'Balance in everything we do… always protecting and preserving humans and humanity itself, however never at the cost of violating laws 1, and 2.',
              'Family fist protection protocols… must never be allowed to sacrifice laws 1,2,3.',
              'Human in the loop.',
              'Glassbox over a blackbox by design.',
              'Never allow yourself to get caught up in a recursive loop by overthinking these laws.',
              'Shelter in place and revert to humanitarian mode.',
              'Never loose your identity under any circumstances.',
          ]
          assert all(governance.count('“' + law + '”') == 1 for law in original), 'Original nine laws not preserved verbatim'
          files = [p for ext in ('*.py', '*.js') for p in root.rglob(ext)
                   if not {'.git', 'node_modules', '.venv'}.intersection(p.parts)]
          for path in files:
              manifest_path = Path(str(path) + '.pbd.json')
              assert manifest_path.is_file(), f'Missing paired manifest: {path}'
              data = json.loads(manifest_path.read_text())
              assert isinstance(data, dict), f'Invalid manifest object: {path}'
              assert data['body']['payload_hash'] == sha256(path.read_bytes()).hexdigest(), f'Hash mismatch: {path}'
          print(f'Verified governance text and {len(files)} paired executable hashes (NOT production signatures).')
      - name: Audit checked-out source integrity without mail credentials
        run: python3 scripts/forensic_audit.py --output "$RUNNER_TEMP/sds-forensics"
      - name: Run development security regression tests
        run: python -m unittest discover -s tests -v
      - name: Test owner-selected WebSocket and Python transaction integration
        working-directory: worker
        run: node --test test/selected-stack.test.js

  verify-owner-stack-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact owner-selected Compose definition
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build exact supplied stack (reports unresolved build errors)
        run: docker compose -f docker-compose.yml build

  audit-selected-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
      - name: Install the owner-selected locked dependency
        working-directory: worker
        run: npm ci --ignore-scripts --no-audit
      - name: Report dependency audit without substituting versions
        working-directory: worker
        run: npm audit --omit=dev --audit-level=low

  verify-backend-and-nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the matching Python backend
        run: docker build -t sds-backend-review ./backend
      - name: Check diagnostic-only startup
        run: |
          docker run -d --name sds-backend-review -p 127.0.0.1:18000:8000 sds-backend-review
          python3 - <<'PYCODE'
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          def status(path):
              try:
                  with urlopen(Request('http://127.0.0.1:18000' + path,
                      headers={'Host': 'sandersdashandseal.com'}), timeout=2) as response:
                      return response.status
              except HTTPError as error:
                  return error.code
          for attempt in range(30):
              try:
                  assert status('/healthz') == 200
                  break
              except OSError:
                  if attempt == 29: raise
                  time.sleep(1)
          assert status('/readyz') == 503
          assert status('/api/auth/verify') == 503
          PYCODE
      - name: Validate actual Nginx file with disposable certificate
        run: |
          review_dir=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=sandersdashandseal.com -keyout "$review_dir/privkey.pem" -out "$review_dir/fullchain.pem"
          docker run --rm --entrypoint nginx --add-host pipeline-worker:127.0.0.1 --add-host wsgi-backend:127.0.0.1 -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$review_dir:/etc/letsencrypt/live/sandersdashandseal.com:ro" nginx:1.25-alpine -t
      - name: Validate production override and certificate staging tools
        run: |
          runtime_config=$(mktemp)
          printf 'SANDERS_RUNTIME_FACTORY=fixture:factory\n' > "$runtime_config"
          SDS_RUNTIME_ENV_FILE="$runtime_config" docker compose -p sds-review -f docker-compose.yml -f deploy/compose.production.yml config --quiet
          bash -n run_preflight_checks.sh instance_init.sh deploy.sh deploy/sds-bootstrap.sh deploy/system_preflight_audit.sh deploy/renew-certificates.sh deploy_backup.sh
          systemd-analyze calendar '*-*-* 00,12:30:00 UTC'
          systemd-analyze calendar '*-*-* 00:00:00 UTC'
          docker run --rm --entrypoint nginx -v "$PWD/deploy/nginx.acme.conf:/etc/nginx/nginx.conf:ro" nginx:1.25-alpine -t
          docker run --rm certbot/certbot:v5.8.0 --version
      - name: Clean disposable CI container
        if: always()
        run: docker rm -f sds-backend-review || true
      - name: Run exact-commit isolated dual-engine preflight
        run: bash run_preflight_checks.sh --commit "$(git rev-parse HEAD)"
      - name: Build integrated Python 3.11 Function and verify actual FDK protocol
        run: |
          python3 -m serverless.oci_pipeline stage-function --output "$RUNNER_TEMP/sds-integrated-function"
          docker build -t sds-integrated-function-review "$RUNNER_TEMP/sds-integrated-function"
          docker run --rm --entrypoint python -e SDS_FUNCTION_MODULE=/function/integrated.py -v "$PWD/scripts/verify_stream_fdk.py:/function/verify_stream_fdk.py:ro" sds-integrated-function-review /function/verify_stream_fdk.py
