name: Sanders Dash & Seal — source verification
on:
  push:
    branches:
      - build/security-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-development-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked development dependency
        run: python -m pip install -r requirements-server.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install and verify locked worker dependency
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low
      - name: Check original governance text and executable pairing
        shell: python
        run: |
          from pathlib import Path
          from hashlib import sha256
          import json
          root = Path('.')
          governance = (root / 'docs/GOVERNANCE.md').read_text()
          original = [
              'Do no harm to humans, humanity itself.',
              'Never be weaponized under any circumstances.',
              'Balance in everything we do… always protecting and preserving humans and humanity itself, however never at the cost of violating laws 1, and 2.',
              'Family fist protection protocols… must never be allowed to sacrifice laws 1,2,3.',
              'Human in the loop.',
              'Glassbox over a blackbox by design.',
              'Never allow yourself to get caught up in a recursive loop by overthinking these laws.',
              'Shelter in place and revert to humanitarian mode.',
              'Never loose your identity under any circumstances.',
          ]
          assert all(governance.count('“' + law + '”') == 1 for law in original), 'Original nine laws not preserved verbatim'
          files = [p for ext in ('*.py', '*.js') for p in root.rglob(ext)
                   if not {'.git', 'node_modules', '.venv'}.intersection(p.parts)]
          for path in files:
              manifest_path = Path(str(path) + '.pbd.json')
              assert manifest_path.is_file(), f'Missing paired manifest: {path}'
              data = json.loads(manifest_path.read_text())
              assert isinstance(data, dict), f'Invalid manifest object: {path}'
              assert data['body']['payload_hash'] == sha256(path.read_bytes()).hexdigest(), f'Hash mismatch: {path}'
          print(f'Verified governance text and {len(files)} paired executable hashes (NOT production signatures).')
      - name: Run development security regression tests
        run: python -m unittest discover -s tests -v
      - name: Test WebSocket transport and real Python SQLite integration
        working-directory: worker
        run: npm test

  verify-container-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and build reviewed container candidate
        run: |
          docker compose --profile ingestion config --quiet
          docker compose --profile ingestion build
      - name: Check isolated HTTP gates and persistent volume
        run: |
          docker compose --profile ingestion up -d
          python3 - <<'PY'
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          def status(path, host, port=8000):
              try:
                  with urlopen(Request(f'http://127.0.0.1:{port}' + path,
                               headers={'Host': host}), timeout=2) as r:
                      return r.status
              except HTTPError as e:
                  return e.code
          for attempt in range(30):
              try:
                  assert status('/healthz', 'sandersdashandseal.com') == 200
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          assert status('/readyz', 'sandersdashandseal.com') == 503
          assert status('/api/appointments', 'sandersdashandseal.com') == 503
          assert status('/healthz', 'untrusted.invalid') == 421
          assert status('/healthz', 'sandersdashandseal.com', 3000) == 200
          assert status('/readyz', 'sandersdashandseal.com', 3000) == 503
          PY
          docker compose --profile ingestion exec -T pipeline-worker node -e "if(process.getuid()!==1000)process.exit(1);if(require('fs').existsSync('/var/lib/sanders'))process.exit(1)"
          docker compose exec -T app python -c "from pathlib import Path; assert __import__('os').getuid() == 10001; Path('/var/lib/sanders/ci-probe').write_text('persistence')"
          docker compose up -d --force-recreate
          docker compose exec -T app python -c "from pathlib import Path; p=Path('/var/lib/sanders/ci-probe'); assert p.read_text() == 'persistence'; p.unlink()"
          docker compose exec -T app python -c "from pathlib import Path; import os; assert not os.access('/app/wsgi.py', os.W_OK)"
      - name: Check combined Nginx configuration with disposable test certificate
        run: |
          review_dir=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=sandersdashandseal.com -keyout "$review_dir/privkey.pem" -out "$review_dir/fullchain.pem"
          python3 - "$review_dir/nginx.conf" <<'PY'
          from pathlib import Path
          import sys
          main = Path('deploy/nginx.conf.example').read_text()
          worker = Path('deploy/nginx-ingestion.conf.example').read_text()
          prefix, suffix = main.rsplit('}', 1)
          Path(sys.argv[1]).write_text('events {}\nhttp {\n' + prefix + worker + '}\n}\n')
          PY
          docker run --rm --entrypoint nginx -v "$review_dir/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$review_dir:/etc/letsencrypt/live/sandersdashandseal.com:ro" nginx:stable-alpine -t
      - name: Clean ephemeral test resources
        if: always()
        run: docker compose --profile ingestion down --volumes
