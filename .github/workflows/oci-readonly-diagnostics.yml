name: Sanders Dash & Seal read-only Oracle installation diagnosis
on:
  workflow_dispatch:
  push:
    branches: [codex/ai-task-execution]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the existing OCI command-line version
        run: python -m pip install oci-cli==3.95.1
      - name: Read existing installation output without changing Oracle resources
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.SDS_OCI_FINGERPRINT_V2 }}
          OCI_PRIVATE_KEY: ${{ secrets.SDS_OCI_PRIVATE_KEY_V2 }}
          OCI_REGION: ${{ secrets.OCI_REGION || 'us-phoenix-1' }}
          OCI_STACK_OCID: ${{ secrets.OCI_STACK_OCID || vars.OCI_STACK_OCID || 'ocid1.ormstack.oc1.phx.amaaaaaaftib4xqaggduipcxfh7oscxgqq4276qzr3u25dynr3vzs3hiadqa' }}
        run: python -m deploy.diagnose_oracle
