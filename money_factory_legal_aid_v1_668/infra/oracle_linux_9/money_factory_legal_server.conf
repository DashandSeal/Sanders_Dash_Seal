# Nginx server config for the Sanders Dash & Seal sites — repo source of
# truth. deploy/deploy_all.sh installs this file to
# /etc/nginx/conf.d/money_factory_legal_server.conf on EVERY deploy
# (keeping a timestamped backup of the previous file first). Before
# 2026-11-23 the port-80 block was written by the deploy only when the TLS
# cert file was absent, and the port-443 block existed only as a one-time
# append made by .github/workflows/restore-nginx-443-20261121.yml; when the
# server file was later rewritten without that append, nginx came up with
# no port 443 listener at all. Keeping both blocks here, installed on
# every run, is the permanent repair. The 443 block below follows that
# known-good restore workflow. Location blocks live in the snippet
# (money_factory_legal.conf), included by both server blocks.
# 2026-11-23 takedown (owner's order): the 443 block previously carried
# `location = / { try_files /index.html =404; }`, which served the static
# Police Men dashboard copy at the root of every domain. An exact-match
# location beats the snippet's `location /` proxy, so that block shadowed
# the Dash & Seal app itself — Dash & Seal never showed on its own
# domains. The block is removed; / now reaches the app through the
# snippet. The dashboard's new home is a password-protected page (owner
# decision 2026-11-22), built separately.

# 2026-11-26 (founder-approved certificate expansion): sandersnexusshield.com,
# www.sandersnexusshield.com, sanderssixindustry.com and
# www.sanderssixindustry.com added to both server_name lines; the platform
# certificate was expanded to cover them the same day (one-time workflow
# .github/workflows/expand-cert-nexusshield-sixindustry-20261126.yml).
# 2026-11-28 (founder-approved corrective issuance): the three company
# subdomains under sanderslegalhelpersllc.com -- sandgsecurityinc (S & G
# Security Inc., Headquarters), sandershomehealthcareandcaregiversllc
# (Sanders Home Healthcare & Caregivers LLC) and sandersseniorlivingllc
# (Sanders Senior Living LLC) -- added to both server_name lines; the
# platform certificate was expanded 14 -> 17 names to cover them the same
# day (one-time workflow
# .github/workflows/expand-cert-company-subdomains-20261128.yml).
# 2026-11-28: the three company subdomains are long names; with 17
# names on the server_name lines the default server_names_hash
# bucket size (64) could no longer hold them (nginx emerg "could
# not build server_names_hash" on the first deploy attempt).
server_names_hash_bucket_size 128;

server {
    listen 80 default_server;
    server_name sandersdashandseal.com www.sandersdashandseal.com sanderslegalhelpersllc.com www.sanderslegalhelpersllc.com sanderssixshield.com www.sanderssixshield.com sanderssecurestack.com www.sanderssecurestack.com sandersemergencyglobalcommunication.com www.sandersemergencyglobalcommunication.com sandersnexusshield.com www.sandersnexusshield.com sanderssixindustry.com www.sanderssixindustry.com sandgsecurityinc.sanderslegalhelpersllc.com sandershomehealthcareandcaregiversllc.sanderslegalhelpersllc.com sandersseniorlivingllc.sanderslegalhelpersllc.com 129.146.111.166 _;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/money_factory_legal.conf;
}

server {
    listen 443 ssl;
    server_name sandersdashandseal.com www.sandersdashandseal.com sanderslegalhelpersllc.com www.sanderslegalhelpersllc.com sanderssixshield.com www.sanderssixshield.com sanderssecurestack.com www.sanderssecurestack.com sandersemergencyglobalcommunication.com www.sandersemergencyglobalcommunication.com sandersnexusshield.com www.sandersnexusshield.com sanderssixindustry.com www.sanderssixindustry.com sandgsecurityinc.sanderslegalhelpersllc.com sandershomehealthcareandcaregiversllc.sanderslegalhelpersllc.com sandersseniorlivingllc.sanderslegalhelpersllc.com;

    ssl_certificate /etc/letsencrypt/live/sandersdashandseal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandersdashandseal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # TLS key-exchange groups (SC-13 lift, founder-approved
    # 2026-11-26): the hybrid post-quantum group first
    # (X25519MLKEM768 — ML-KEM-768, FIPS 203, combined with X25519),
    # classical groups after it for compatibility. The host's
    # OpenSSL 3.5.9 offers the hybrid group, but without this line
    # the server's group list omits it and clients offering a
    # hybrid key share are refused (TLS alert 47, observed live
    # 2026-11-26). Proven after this change by an outside
    # handshake negotiating X25519MLKEM768.
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1:secp521r1;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/money_factory_legal.conf;
}
