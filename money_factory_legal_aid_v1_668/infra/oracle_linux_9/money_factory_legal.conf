location /healthz {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /legal-aid/ {
    proxy_pass http://127.0.0.1:8668/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Police Men telemetry — server-only until the password-protected page
# exists (owner decisions 2026-11-22 / 2026-11-23: the backend is not
# for public viewing).
location = /rtsa/status {
    default_type application/json;
    alias /var/www/rtsa/status.json;
    allow 127.0.0.1;
    allow ::1;
    deny all;
}
