# 2026-11-13 (upgrade/sota-web-nginx-20261113): nginx 1.25-alpine (EOL) ->
# nginx:1.30.6-alpine; obsolete `version:` key removed (Compose spec warns
# it is obsolete); service names aligned with compose.yaml and deploy.sh
# (reverse-proxy, wsgi-backend, pipeline-worker); wsgi-backend now builds
# the real backend/Dockerfile (root Dockerfile was a Python script, so this
# build could never run); pipeline-worker service added (nginx.conf routes
# /ws/ and telemetry to it); forensic daemon python 3.12 -> 3.14.
services:
  # Hardened Reverse Proxy Firewall Layer
  reverse-proxy:
    image: nginx:1.30.6-alpine
    container_name: sds_reverse_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - sds-secure-bridge
    depends_on:
      - wsgi-backend
      - pipeline-worker

  # High-Throughput Hardened WSGI Platform Core
  wsgi-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sds_wsgi_backend
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - STRIPE_WEBHOOK_SECRET=whsec_your_live_production_key_here
      - OPERATOR_EMAIL=daddydik323@gmail.com
    volumes:
      - sds-ledger-volume:/app/data
      - .:/app
    networks:
      - sds-secure-bridge

  # Node pipeline worker: serves /ws/, /v1/telemetry/* (see nginx.conf).
  pipeline-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sds_pipeline_worker
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_BACKEND_URL=http://wsgi-backend:8000
      - MEMORY_LIMIT_MB=512
    networks:
      - sds-secure-bridge
    depends_on:
      - wsgi-backend

  # Level 10 Real-Time Continuous Forensic Sync & Self-Healing Daemon
  l10-forensic-daemon:
    image: python:3.14-slim-bookworm
    container_name: sds_forensic_daemon
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - OPERATOR_EMAIL=daddydik323@gmail.com
    command: python3 security/sovereign_runtime.py
    restart: always
    stop_grace_period: 10s
    networks:
      - sds-secure-bridge

networks:
  sds-secure-bridge:
    name: sds_isolated_network_perimeter
    driver: bridge

volumes:
  sds-ledger-volume:
    name: sds_production_ledger_data
