version: '3.8'

services:
  # Hardened Reverse Proxy Firewall Layer
  nginx-edge:
    image: nginx:1.25-alpine
    container_name: sds_nginx_edge
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - sds-secure-bridge
    depends_on:
      - wsgi-core

  # High-Throughput Hardened WSGI Platform Core
  wsgi-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sds_wsgi_core
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - STRIPE_WEBHOOK_SECRET=whsec_your_live_production_key_here
      - OPERATOR_EMAIL=daddydik323@gmail.com
    volumes:
      - sds-ledger-volume:/app/data
      - .:/app
    networks:
      - sds-secure-bridge

  # Level 10 Real-Time Continuous Forensic Sync & Self-Healing Daemon
  l10-forensic-daemon:
    image: python:3.12-slim-bookworm
    container_name: sds_forensic_daemon
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - OPERATOR_EMAIL=daddydik323@gmail.com
    command: python3 security/sovereign_runtime.py
    restart: always
    stop_grace_period: 10s
    networks:
      - sds-secure-bridge

networks:
  sds-secure-bridge:
    name: sds_isolated_network_perimeter
    driver: bridge

volumes:
  sds-ledger-volume:
    name: sds_production_ledger_data
