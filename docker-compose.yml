version: '3.8'

services:
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: sds_reverse_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs_volume:/etc/letsencrypt:ro
      - certbot_validation_volume:/var/www/certbot:ro
    networks:
      - sds_production_network
    depends_on:
      - pipeline-worker
      - wsgi-backend

  pipeline-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sds_pipeline_worker
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_BACKEND_URL=http://wsgi-backend:8000
      - MEMORY_LIMIT_MB=512
    networks:
      - sds_production_network
    depends_on:
      - wsgi-backend

  wsgi-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sds_wsgi_backend
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/sds_production.db
    volumes:
      - sqlite_storage:/app/data:rw
    networks:
      - sds_production_network

volumes:
  certs_volume:
    driver: local
  certbot_validation_volume:
    driver: local
  sqlite_storage:
    driver: local

networks:
  sds_production_network:
    driver: bridge
