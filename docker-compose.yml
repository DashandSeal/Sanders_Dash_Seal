version: '3.8'

services:
  # 🌐 Hardened Reverse Proxy Firewall Layer
  nginx-edge:
    image: nginx:1.25-alpine
    container_name: sds_nginx_edge
    restart: always
    ports:
      - "80:80"   # Securely exposes web standard HTTP traffic to host interface
      - "443:443" # Securely exposes encrypted TLS traffic to host interface
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - sds-secure-bridge
    depends_on:
      - wsgi-core

  # 💎 High-Throughput Hardened WSGI Platform Core
  wsgi-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sds_wsgi_core
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - STRIPE_WEBHOOK_SECRET=whsec_your_live_production_key_here
    volumes:
      - sds-ledger-volume:/app/data
    networks:
      - sds-secure-bridge
    # No ports exposed to the host interface. Traffic can ONLY be routed by Nginx via the bridge.

networks:
  sds-secure-bridge:
    name: sds_isolated_network_perimeter
    driver: bridge

volumes:
  sds-ledger-volume:
    name: sds_production_ledger_data
