version: '3.8'

services:
  # Hardened Reverse Proxy Firewall Layer.
  # Service names match compose.yaml and the upstreams in nginx.conf
  # (wsgi-backend:8000, pipeline-worker:3000); the previous names
  # (nginx-edge, wsgi-core) matched nothing nginx proxied to.
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: sds_nginx_edge
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - sds-secure-bridge
    depends_on:
      - wsgi-backend
      - pipeline-worker

  # High-Throughput Hardened WSGI Platform Core
  wsgi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sds_wsgi_core
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set in the environment or .env file}
      - OPERATOR_EMAIL=daddydik323@gmail.com
    volumes:
      - sds-ledger-volume:/app/data
      - .:/app
    networks:
      - sds-secure-bridge

  # Node pipeline worker: serves the WebSocket ingest path and calls the
  # Python backend at http://wsgi-backend:8000 (worker/src/index.js).
  # Matches the pipeline-worker service in compose.yaml.
  pipeline-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sds_pipeline_worker
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_BACKEND_URL=http://wsgi-backend:8000
      - MEMORY_LIMIT_MB=512
    networks:
      - sds-secure-bridge
    depends_on:
      - wsgi-backend

networks:
  sds-secure-bridge:
    name: sds_isolated_network_perimeter
    driver: bridge

volumes:
  sds-ledger-volume:
    name: sds_production_ledger_data
