version: '3.8'

services:
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: sds_reverse_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs_volume:/etc/letsencrypt:ro
      - certbot_validation_volume:/var/www/certbot:ro
    networks:
      - sds_production_network
    depends_on:
      - pipeline-worker
      - wsgi-backend

  pipeline-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sds_pipeline_worker
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_BACKEND_URL=http://wsgi-backend:8000
      - MEMORY_LIMIT_MB=512
    networks:
      - sds_production_network
    depends_on:
      - wsgi-backend

  wsgi-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sds_wsgi_backend
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/sds_production.db
      # STRIPE_WEBHOOK_SECRET is supplied by the host environment
      # (systemd EnvironmentFile /etc/sanders-dash-seal/runtime.env, or
      # exported by the installer). Empty default: the app fails closed
      # at startup when no secret is present; never bake one in here.
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      # P2 (2026-11-13): ledger volume converged on sds-ledger-volume
      # (named sds_production_ledger_data), the same volume
      # docker-compose.yml uses, so the installer stack and the
      # legacy/backup stack no longer keep separate ledger data.
      # Existing data lives in sds-ledger-volume; a host that previously
      # ran this stack under the old volume name must copy that data over once.
      - sds-ledger-volume:/app/data:rw
    networks:
      - sds_production_network

volumes:
  certs_volume:
    driver: local
  certbot_validation_volume:
    driver: local
  sds-ledger-volume:
    name: sds_production_ledger_data
    driver: local

networks:
  sds_production_network:
    driver: bridge
